<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Utilities · Next-Gen Tools</title>
  <!-- Bootstrap 5 + icons + font -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0a0f1e 0%, #0f1a2f 100%);
      padding: 2rem 1rem;
      min-height: 100vh;
      color: #e0e7ff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dashboard-wrapper {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .dashboard-title {
      font-weight: 700;
      font-size: 3rem;
      color: #ffffff;
      margin-bottom: 1rem;
      text-shadow: 0 0 30px rgba(0,150,255,0.3);
      letter-spacing: -0.02em;
    }
    .dashboard-subtitle {
      color: #a0b3e0;
      font-size: 1.2rem;
      max-width: 500px;
      margin: 0 auto 2.8rem;
    }
    /* ad container – subtle, keeps design cohesive */
    .ad-container {
      background: rgba(20, 30, 50, 0.7);
      backdrop-filter: blur(10px);
      border: 2px dashed #3a5f8a;
      border-radius: 24px;
      color: #b0c9ff;
      font-weight: 500;
      margin-bottom: 3rem;
    }
    .ad-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 1.5rem 1rem;
    }
    .ad-icon {
      font-size: 2rem;
      opacity: 0.7;
      color: #4f8aff;
    }
    /* main card – one button only */
    .tool-card {
      background: rgba(30, 40, 60, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(100, 150, 255, 0.2);
      border-radius: 32px;
      padding: 2.8rem 2rem 2.5rem;
      box-shadow: 0 20px 40px -16px rgba(0,0,0,0.5);
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    .tool-card:hover {
      transform: translateY(-6px);
      border-color: rgba(80, 160, 255, 0.6);
      box-shadow: 0 28px 48px -16px rgba(0, 120, 255, 0.25);
    }
    /* glow accent */
    .tool-card::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 40%, rgba(60, 130, 255, 0.08), transparent 60%);
      pointer-events: none;
    }
    .tool-icon {
      font-size: 3.6rem;
      color: #7aa9ff;
      margin-bottom: 1.2rem;
      display: inline-block;
      filter: drop-shadow(0 0 20px rgba(60, 150, 255, 0.3));
    }
    .tool-title {
      font-weight: 700;
      font-size: 2rem;
      color: #f0f4ff;
      letter-spacing: -0.01em;
    }
    .tool-desc {
      color: #b6c8f0;
      font-size: 1.05rem;
      margin: 0.75rem 0 2rem;
      opacity: 0.9;
    }
    /* primary CTA – the one and only button */
    .btn-ai-agent {
      background: linear-gradient(145deg, #2b6aff, #1a4bd0);
      border: none;
      padding: 1rem 2.8rem;
      font-weight: 600;
      font-size: 1.3rem;
      border-radius: 60px;
      color: white;
      box-shadow: 0 12px 28px -8px rgba(30, 100, 255, 0.45);
      transition: all 0.25s ease;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(4px);
    }
    .btn-ai-agent:hover {
      background: linear-gradient(145deg, #3f7aff, #255ce0);
      transform: scale(1.02);
      box-shadow: 0 18px 36px -10px #1a4bd0;
      color: white;
      border-color: rgba(255, 255, 255, 0.25);
    }
    .btn-ai-agent i {
      font-size: 1.6rem;
      transition: transform 0.2s;
    }
    .btn-ai-agent:hover i {
      transform: translateX(6px);
    }
    /* remove "coming soon" badge – replaced with clean micro tag */
    .meta-tag {
      background: rgba(60, 130, 255, 0.10);
      color: #8bb3ff;
      border-radius: 40px;
      padding: 0.25rem 1.2rem;
      font-size: 0.8rem;
      font-weight: 500;
      display: inline-block;
      border: 1px solid rgba(60, 130, 255, 0.10);
      backdrop-filter: blur(4px);
      margin-top: 1.8rem;
      letter-spacing: 0.3px;
    }
    /* responsive */
    @media (max-width: 500px) {
      .dashboard-title {
        font-size: 2.4rem;
      }
      .tool-title {
        font-size: 1.7rem;
      }
      .btn-ai-agent {
        padding: 0.8rem 1.8rem;
        font-size: 1.1rem;
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard-wrapper">
    <!-- header -->
    <div class="text-center">
      <h1 class="dashboard-title">
        <i class="bi bi-cpu me-2" style="color: #5f8eff;"></i>AI Utilities
      </h1>
      <p class="dashboard-subtitle">
        Next‑gen tools, crafted for the future. <span style="color: #7aa9ff;">One powerful agent</span> to start.
      </p>
    </div>

    <!-- subtle ad placeholder (keeps the design rich) -->
    <div class="ad-container">
      <div class="ad-placeholder">
        <i class="bi bi-megaphone-fill ad-icon"></i>
        <span>⚡ Launch special · AI Studio preview</span>
        <i class="bi bi-arrow-right-circle-fill ad-icon" style="opacity: 0.4;"></i>
      </div>
    </div>

    <!--  single tool card: AI Agent Generator  -->
    <div class="tool-card">
      <div class="tool-icon">
        <i class="bi bi-robot"></i>
      </div>
      <h2 class="tool-title">AI Agent Generator</h2>
      <p class="tool-desc">
        Build, customize & deploy intelligent agents in seconds.
      </p>
      <!-- THE ONE BUTTON with direct link -->
      <a href="https://getopenmind.in/ai-studio.html" target="_blank" class="btn-ai-agent" role="button">
        <i class="bi bi-lightning-fill"></i> Launch Agent Studio
        <i class="bi bi-arrow-right-short" style="font-size: 2rem;"></i>
      </a>
      <!-- subtle meta tag – no "coming soon" wording -->
      <div class="meta-tag">
        <i class="bi bi-rocket-takeoff me-1"></i> early access
      </div>
    </div>

    <!-- minimal footer (clean, no "coming soon") -->
    <div class="text-center mt-5" style="color: #50658a; font-size: 0.9rem; letter-spacing: 0.3px;">
      <i class="bi bi-dot"></i> one tool · infinite potential <i class="bi bi-dot"></i>
    </div>
  </div>
</body>
</html>
