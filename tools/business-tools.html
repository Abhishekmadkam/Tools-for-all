<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Tools · Coming Soon</title>
    <!-- Bootstrap 5 + Icons + Font -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f2f6fe;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(43, 110, 255, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(43, 110, 255, 0.06) 0%, transparent 60%);
            padding: 1.5rem;
        }

        .coming-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 64px;
            padding: 3.5rem 3rem;
            max-width: 780px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(11, 26, 51, 0.10), 0 10px 30px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            transition: all 0.3s ease;
        }

        @media (max-width: 576px) {
            .coming-card {
                padding: 2.5rem 1.5rem;
                border-radius: 40px;
            }
        }

        /* ----- LOGO / BRAND ICON ----- */
        .brand-icon {
            background: #0b1a33;
            color: white;
            width: 80px;
            height: 80px;
            border-radius: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.6rem;
            margin-bottom: 2rem;
            box-shadow: 0 14px 34px rgba(11, 26, 51, 0.15);
            transition: transform 0.2s ease;
        }
        .brand-icon i {
            color: #6c9bff;
        }
        .brand-icon:hover {
            transform: scale(1.02);
        }

        /* ----- TITLE ----- */
        .coming-title {
            font-weight: 800;
            font-size: 3.6rem;
            letter-spacing: -0.03em;
            color: #0b1a33;
            line-height: 1.1;
            margin-bottom: 0.6rem;
        }
        .coming-title span {
            color: #2b6eff;
            background: #eef5ff;
            padding: 0 0.5rem;
            border-radius: 18px;
            display: inline-block;
        }

        @media (max-width: 576px) {
            .coming-title {
                font-size: 2.6rem;
            }
        }
        @media (max-width: 400px) {
            .coming-title {
                font-size: 2.2rem;
            }
        }

        /* ----- DESCRIPTION ----- */
        .coming-desc {
            color: #4a6582;
            font-size: 1.2rem;
            font-weight: 400;
            max-width: 580px;
            margin: 0.6rem auto 0;
            line-height: 1.7;
        }
        .coming-desc br {
            display: block;
        }

        @media (max-width: 480px) {
            .coming-desc {
                font-size: 1rem;
            }
        }

        /* ----- DECORATIVE SHAPES (background only) ----- */
        .bg-shape {
            position: fixed;
            border-radius: 50%;
            background: rgba(43, 110, 255, 0.03);
            z-index: -1;
            pointer-events: none;
        }
        .shape-1 {
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
        }
        .shape-2 {
            width: 500px;
            height: 500px;
            bottom: -150px;
            right: -150px;
            background: rgba(43, 110, 255, 0.02);
        }

        /* subtle pulse on logo */
        @keyframes soft-pulse {
            0% {
                opacity: 0.8;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.02);
            }
            100% {
                opacity: 0.8;
                transform: scale(1);
            }
        }
        .brand-icon {
            animation: soft-pulse 4s infinite ease-in-out;
        }
    </style>
</head>
<body>

    <!-- background decorative shapes -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <!-- MAIN CARD -->
    <div class="coming-card">

        <!-- LOGO -->
        <div class="brand-icon">
            <i class="bi bi-tools"></i>
        </div>

        <!-- TITLE -->
        <h1 class="coming-title">
            Business Tools <br /><span>coming soon</span>
        </h1>

        <!-- DESCRIPTION -->
        <p class="coming-desc">
            The all‑in‑one toolkit for modern businesses.<br />
            Invoicing, analytics, inventory, tasks &amp; more — built for every kind of business.
        </p>

        <!-- absolutely nothing else -->
    </div>

    <!-- Bootstrap JS (not required but included for completeness) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
