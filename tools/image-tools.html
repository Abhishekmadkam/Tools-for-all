<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Studio Pro</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <style>
        /* ============================================
           TEAMORBITS DESIGN SYSTEM
           ============================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "DM Sans", sans-serif;
            background: #050505;
            color: #f5f5f5;
            overflow-x: hidden;
            cursor: none;
            min-height: 100vh;
            padding: 20px 0;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        ::selection {
            background: #ffffff;
            color: #000000;
        }

        :root {
            --bg: #050505;
            --bg-soft: #090909;
            --card: #0d0d0d;
            --card-hover: #111111;
            --white: #ffffff;
            --text: #eeeeee;
            --muted: #8a8a8a;
            --muted-dark: #555555;
            --line: rgba(255, 255, 255, 0.1);
            --line-strong: rgba(255, 255, 255, 0.18);
            --max: 1240px;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        .container {
            width: min(var(--max), calc(100% - 48px));
            margin: auto;
        }

        /* ============================================
           CUSTOM CURSOR (TeamOrbits style)
           ============================================ */
        .cursor-dot,
        .cursor-ring {
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        .cursor-dot {
            width: 7px;
            height: 7px;
            background: #fff;
        }

        .cursor-ring {
            width: 38px;
            height: 38px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: width 0.25s var(--ease),
                height 0.25s var(--ease),
                background 0.25s ease,
                border 0.25s ease;
        }

        body.cursor-hover .cursor-ring {
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.08);
            border-color: #fff;
        }

        @media(max-width:900px) {
            body {
                cursor: auto;
            }
            .cursor-dot,
            .cursor-ring {
                display: none;
            }
        }

        /* ============================================
           NOISE OVERLAY
           ============================================ */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 999;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.7'/%3E%3C/svg%3E");
        }

        /* ============================================
           HEADER
           ============================================ */
        .app-header {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 16px 30px;
            margin-bottom: 28px;
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            font-family: "Space Grotesk", sans-serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.05em;
            color: #fff;
        }

        .logo-icon span {
            color: #666;
        }

        .logo-icon i {
            color: #fff;
            margin-right: 6px;
        }

        .logo-sub {
            font-size: 12px;
            color: #777;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-left: 1px solid var(--line);
            padding-left: 14px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-btn {
            background: transparent;
            border: 1px solid var(--line-strong);
            color: #aaa;
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 500;
            transition: 0.3s ease;
            cursor: pointer;
        }

        .header-btn:hover {
            background: #fff;
            color: #000;
            transform: translateY(-2px);
        }

        .header-btn i {
            margin-right: 6px;
        }

        /* ============================================
           EDITOR LAYOUT
           ============================================ */
        .editor-layout {
            display: grid;
            grid-template-columns: 260px 1fr 300px;
            gap: 20px;
            margin-bottom: 24px;
        }

        .panel {
            background: rgba(13, 13, 13, 0.92);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 22px 20px;
            border: 1px solid var(--line);
            height: fit-content;
        }

        /* ============================================
           TOOLS PANEL
           ============================================ */
        .tools-header {
            font-family: "Space Grotesk", sans-serif;
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ccc;
        }

        .tools-header i {
            color: #666;
        }

        .tools-grid {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tool-btn {
            background: transparent;
            border: none;
            padding: 11px 14px;
            border-radius: 16px;
            text-align: left;
            font-weight: 500;
            transition: 0.25s var(--ease);
            display: flex;
            align-items: center;
            gap: 12px;
            color: #999;
            width: 100%;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .tool-btn i {
            font-size: 1.2rem;
            width: 26px;
            color: #555;
            transition: 0.25s;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            transform: translateX(4px);
        }

        .tool-btn:hover i {
            color: #aaa;
        }

        .tool-btn.active {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid var(--line-strong);
        }

        .tool-btn.active i {
            color: #fff;
        }

        .apply-btn {
            margin-top: 18px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 100px;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            transition: 0.3s var(--ease);
            cursor: pointer;
            font-size: 14px;
        }

        .apply-btn:hover {
            transform: scale(1.02);
            background: #ddd;
        }

        /* ============================================
           CANVAS PANEL
           ============================================ */
        .upload-area {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 22px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            border: 2px dashed var(--line);
            transition: 0.3s;
            min-height: 340px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .upload-area:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .upload-area.dragover {
            background: rgba(255, 255, 255, 0.06);
            border-color: #fff;
        }

        .upload-content i {
            font-size: 4rem;
            color: #555;
            margin-bottom: 16px;
        }

        .upload-content h3 {
            font-family: "Space Grotesk", sans-serif;
            font-weight: 600;
            color: #aaa;
            font-size: 1.4rem;
        }

        .upload-content p {
            color: #555;
            font-size: 0.95rem;
        }

        .image-container {
            display: none;
            width: 100%;
            position: relative;
        }

        #mainImage {
            max-width: 100%;
            max-height: 500px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            object-fit: contain;
            transition: filter 0.2s ease;
        }

        .image-overlay {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #ccc;
            border: 1px solid var(--line);
        }

        #drawCanvas {
            display: none;
            width: 100%;
            height: 400px;
            border-radius: 16px;
            border: 1px solid var(--line);
            margin-top: 14px;
            background: #0a0a0a;
        }

        /* ============================================
           PROPERTIES PANEL
           ============================================ */
        .prop-title {
            font-family: "Space Grotesk", sans-serif;
            font-weight: 600;
            color: #ccc;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }

        .prop-title i {
            color: #555;
        }

        .prop-control {
            margin-bottom: 14px;
        }

        .prop-control label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #888;
            display: block;
            margin-bottom: 4px;
        }

        .range-slider {
            width: 100%;
            height: 5px;
            border-radius: 10px;
            background: #222;
            outline: none;
            -webkit-appearance: none;
        }

        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            transition: 0.15s;
        }

        .range-slider::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .tool-input,
        .tool-select,
        .color-picker {
            width: 100%;
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid #222;
            background: #0a0a0a;
            color: #ddd;
            font-weight: 500;
        }

        .tool-input:focus,
        .tool-select:focus {
            outline: none;
            border-color: #555;
        }

        .filter-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0;
        }

        .filter-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--line);
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 0.8rem;
            font-weight: 500;
            transition: 0.2s;
            cursor: pointer;
            color: #aaa;
        }

        .filter-badge:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            transform: translateY(-2px);
        }

        .filter-badge.active-filter {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border-color: #fff;
        }

        .btn-secondary-custom {
            background: rgba(255, 255, 255, 0.05);
            color: #ccc;
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 10px;
            font-weight: 600;
            width: 100%;
            transition: 0.2s;
            cursor: pointer;
        }

        .btn-secondary-custom:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ============================================
           BOTTOM TOOLBAR
           ============================================ */
        .bottom-toolbar {
            background: rgba(13, 13, 13, 0.92);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 14px 24px;
            margin-top: 20px;
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
        }

        .history-actions {
            display: flex;
            gap: 8px;
        }

        .history-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--line);
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #888;
            transition: 0.2s;
            cursor: pointer;
        }

        .history-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .history-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .image-info {
            display: flex;
            gap: 18px;
            font-size: 0.85rem;
            color: #666;
        }

        .image-info span {
            font-weight: 600;
            color: #aaa;
        }

        .download-btn {
            background: #fff;
            color: #000;
            border: none;
            border-radius: 20px;
            padding: 10px 28px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.25s var(--ease);
            cursor: pointer;
        }

        .download-btn:hover {
            transform: scale(1.04);
            background: #ddd;
        }

        /* ============================================
           FOOTER — TeamOrbits signature
           ============================================ */
        .footer-brand {
            text-align: center;
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
            color: #555;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.04em;
        }

        .footer-brand i {
            color: #888;
            margin: 0 4px;
        }

        .footer-brand strong {
            color: #aaa;
            font-weight: 700;
        }

        /* ============================================
           TOAST
           ============================================ */
        .toast-msg {
            position: fixed;
            top: 24px;
            right: 24px;
            background: #0d0d0d;
            border: 1px solid var(--line-strong);
            color: #eee;
            padding: 14px 28px;
            border-radius: 60px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            z-index: 99999;
            font-weight: 500;
            backdrop-filter: blur(12px);
        }

        /* ============================================
           LIVE PREVIEW INDICATOR
           ============================================ */
        .live-indicator {
            display: none;
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #6f6;
            border: 1px solid rgba(100, 255, 100, 0.2);
            letter-spacing: 0.06em;
            font-weight: 600;
        }

        .live-indicator i {
            margin-right: 6px;
            animation: pulse-dot 1.2s infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 1100px) {
            .editor-layout {
                grid-template-columns: 1fr;
            }
            .tools-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            }
        }

        @media (max-width: 600px) {
            .app-header {
                padding: 12px 18px;
                flex-direction: column;
                align-items: stretch;
            }
            .logo {
                justify-content: center;
            }
            .header-actions {
                justify-content: center;
            }
            .bottom-toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .image-info {
                justify-content: center;
            }
            .download-btn {
                justify-content: center;
            }
            .container {
                width: calc(100% - 24px);
            }
        }

        /* Dark mode toggle state */
        body.dark-mode .panel,
        body.dark-mode .app-header,
        body.dark-mode .bottom-toolbar {
            background: rgba(255, 255, 255, 0.06);
        }
        body.dark-mode .upload-area {
            background: rgba(255, 255, 255, 0.04);
        }
        body.dark-mode .filter-badge {
            background: rgba(255, 255, 255, 0.08);
        }
    
        /* Professional polish */
        button:focus-visible, input:focus-visible, select:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }
        .panel { box-shadow: 0 20px 60px rgba(0,0,0,.18); }
        .upload-area { overflow: hidden; }
        .image-container { text-align:center; }
        @media (max-width:1100px) {
            .panel { width:100%; }
            .tools-grid { grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
            .tool-btn { justify-content:center; text-align:center; flex-direction:column; min-height:84px; }
            .tool-btn:hover { transform:translateY(-2px); }
        }
        @media (max-width:600px) {
            body { padding:8px 0; }
            .panel { border-radius:22px; padding:16px; }
            .app-header { border-radius:22px; }
            .logo-sub { display:none; }
            .tools-grid { grid-template-columns:repeat(2,1fr); }
            .image-info { flex-wrap:wrap; }
            .header-btn { flex:1; }
        }

    
        /* ADVANCED CREATIVE SUITE */
        .workspace-status { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:0 0 14px; padding:10px 14px; border:1px solid var(--line); border-radius:16px; color:#777; font-size:.8rem; }
        .workspace-status strong { color:#ddd; }
        .compare-mode { position:relative; overflow:hidden; }
        .compare-mode::after { content:"ORIGINAL"; position:absolute; left:14px; top:14px; padding:5px 10px; border-radius:20px; background:#000b; border:1px solid var(--line); font-size:.7rem; letter-spacing:.08em; }
        .histogram { width:100%; height:80px; display:flex; align-items:end; gap:2px; padding:8px; border:1px solid var(--line); border-radius:16px; margin-top:10px; }
        .histogram span { flex:1; background:linear-gradient(180deg,#fff,#555); border-radius:2px 2px 0 0; opacity:.8; }
        .preset-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
        .preset-btn { padding:11px 8px; border-radius:14px; border:1px solid var(--line); background:#111; color:#aaa; cursor:pointer; transition:.2s; }
        .preset-btn:hover { background:#fff; color:#000; }
        .section-divider { height:1px; background:var(--line); margin:16px 0; }
        .badge-live { font-size:.68rem; padding:4px 8px; border:1px solid var(--line); border-radius:999px; color:#777; }

    </style>
</head>
<body>

    <!-- ============================================
    CUSTOM CURSOR
    ============================================ -->
    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>

    <!-- ============================================
    MAIN APP
    ============================================ -->
    <div class="container">

        <!-- HEADER -->
        <header class="app-header">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Image Studio<span>.</span>
                </div>
                <div class="logo-sub">Professional Creative Suite</div>
            </div>
            <div class="header-actions">
                <button class="header-btn" onclick="toggleDarkMode()" id="darkBtn">
                    <i class="fa-regular fa-moon"></i> Dark
                </button>
                <button class="header-btn" onclick="resetAll()">
                    <i class="fa-solid fa-arrow-rotate-left"></i> Reset
                </button>
                <button class="header-btn" onclick="toggleBeforeAfter()" id="compareBtn">
                    <i class="fa-solid fa-code-compare"></i> Compare
                </button>
                <button class="header-btn" onclick="exportImage()">
                    <i class="fa-regular fa-file-image"></i> Export
                </button>
            </div>
        </header>

        <!-- EDITOR LAYOUT -->
        <div class="editor-layout">

            <!-- LEFT: TOOLS -->
            <div class="panel">
                <div class="tools-header">
                    <i class="fa-solid fa-screwdriver-wrench"></i> Tools
                </div>
                <div class="tools-grid">
                    <button class="tool-btn active" onclick="setActiveTool(this,'crop')"><i class="fa-solid fa-crop"></i> Crop</button>
                    <button class="tool-btn" onclick="setActiveTool(this,'resize')"><i class="fa-solid fa-up-right-and-down-left-from-center"></i> Resize</button>
                    <button class="tool-btn" onclick="setActiveTool(this,'filters')"><i class="fa-solid fa-filter"></i> Filters</button>
                    <button class="tool-btn" onclick="setActiveTool(this,'adjust')"><i class="fa-solid fa-sliders"></i> Adjust</button>
                    <button class="tool-btn" onclick="setActiveTool(this,'rotate')"><i class="fa-solid fa-rotate"></i> Rotate</button>
                    <button class="tool-btn" onclick="setActiveTool(this,'text')"><i class="fa-solid fa-font"></i> Text</button>
                    <button class="tool-btn" onclick="setActiveTool(this,'draw')"><i class="fa-solid fa-pen"></i> Draw</button>
                    <button class="tool-btn" onclick="setActiveTool(this,'frame')"><i class="fa-solid fa-border-all"></i> Frame</button>
                    <button class="tool-btn" onclick="setActiveTool(this,'watermark')"><i class="fa-regular fa-copyright"></i> Watermark</button>
                    <button class="tool-btn" onclick="setActiveTool(this,'effects')"><i class="fa-solid fa-wand-magic-sparkles"></i> Effects</button>
                    <button class="tool-btn" onclick="setActiveTool(this,'background')"><i class="fa-solid fa-image"></i> Background</button>
                    <button class="tool-btn" onclick="setActiveTool(this,'metadata')"><i class="fa-solid fa-circle-info"></i> Image Info</button>
                </div>
                <button class="apply-btn" onclick="applyTool()"><i class="fa-regular fa-circle-check"></i> Apply</button>
            </div>

            <!-- CENTER: CANVAS -->
            <div class="panel">
                <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleImageUpload(event)" />
                    <div class="upload-content" id="uploadPlaceholder">
                        <i class="fa-regular fa-image"></i>
                        <h3>Drop Image Here</h3>
                        <p>or click to browse</p>
                    </div>
                    <div class="image-container" id="imageContainer">
                        <img id="mainImage" class="img-fluid" alt="Preview" />
                        <div class="image-overlay" id="imageOverlay"></div>
                        <div class="live-indicator" id="liveIndicator"><i class="fa-solid fa-circle"></i> LIVE PREVIEW</div>
                    </div>
                </div>
                <canvas id="drawCanvas"></canvas>
            </div>

            <!-- RIGHT: PROPERTIES -->
            <div class="panel" id="propertiesPanel">
                <div class="prop-title"><i class="fa-regular fa-sliders-up"></i> Properties</div>
                <div id="toolProperties">
                    <div class="text-center" style="color:#555; padding:30px 0; font-size:0.95rem;">Select a tool</div>
                </div>
            </div>
        </div>

        <!-- BOTTOM TOOLBAR -->

        // ============================================
        // TOAST
        // ============================================
        function toast(m) {
            let t = document.createElement('div');
            t.className = 'toast-msg';
            t.innerText = m;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2200);
        }

        // ============================================
        // DARK MODE
        // ============================================
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const b = document.getElementById('darkBtn');
            b.innerHTML = document.body.classList.contains('dark-mode') ?
                '<i class="fa-regular fa-sun"></i> Light' :
                '<i class="fa-regular fa-moon"></i> Dark';
        }

        // ============================================
        // TOOL MANAGEMENT
        // ============================================
        function setActiveTool(btn, tool) {
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentTool = tool;
            toolProps.innerHTML = templates[tool] || '<div class="text-center" style="color:#555;padding:20px 0;">No properties</div>';
            if (tool === 'draw' && currentImage) initDrawCanvas();
            else if (drawCanvas) drawCanvas.style.display = 'none';
            if (tool === 'crop' && currentImage) { updateCropPreview();
                livePreview('crop'); }
            if (tool === 'resize' && currentImage) {
                document.getElementById('resizeWidth').value = currentImage.width;
                document.getElementById('resizeHeight').value = currentImage.height;
                livePreview('resize');
            }
            if (tool === 'frame' && currentImage) livePreview('frame');
            if (tool === 'text' && currentImage) livePreview('text');
            if (tool === 'watermark' && currentImage) livePreview('watermark');
            if (tool === 'effects' && currentImage) livePreview('effects');
            if (tool === 'metadata') updateMetadata();
            // hide live indicator if no image
            if (!currentImage) liveIndicator.style.display = 'none';
        }

        function applyTool() {
            if (!currentImage) { toast('Upload an image first'); return; }
            // For filters, the filter is already applied via live preview
            if (currentTool === 'filters') {
                if (activeFilter) {
                    updateImage(mainImage.src);
                    toast('Filter applied: ' + activeFilter);
                } else {
                    toast('Select a filter first');
                }
                return;
            }
            switch (currentTool) {
                case 'crop':
                    applyCrop();
                    break;
                case 'resize':
                    applyResize();
                    break;
                case 'adjust':
                    applyAdjustments();
                    break;
                case 'text':
                    applyText();
                    break;
                case 'draw':
                    saveDrawing();
                    break;
                case 'frame':
                    applyFrame();
                    break;
                case 'watermark':
                    applyWatermark();
                    break;
                case 'effects':
                    applyEffects();
                    break;
                case 'background':
                    applyBackgroundCanvas();
                    break;
                default:
                    toast('Tool applied');
                    break;
            }
            liveIndicator.style.display = 'none';
        }

        // ============================================
        // LIVE PREVIEW ENGINE
        // ============================================
        function livePreview(tool) {
            if (!currentImage) return;
            liveIndicator.style.display = 'block';

            // Debounce preview updates
            clearTimeout(previewTimeout);
            previewTimeout = setTimeout(() => {
                switch (tool) {
                    case 'crop':
                        previewCrop();
                        break;
                    case 'resize':
                        previewResize();
                        break;
                    case 'adjust':
                        previewAdjust();
                        break;
                    case 'text':
                        previewText();
                        break;
                    case 'frame':
                        previewFrame();
                        break;
                    case 'watermark':
                        previewWatermark();
                        break;
                    case 'effects':
                        previewEffects();
                        break;
                }
            }, 100);
        }

        // ---- PREVIEW FUNCTIONS ----
        function previewCrop() {
            const x = document.getElementById('cropX').value / 100 * currentImage.width;
            const y = document.getElementById('cropY').value / 100 * currentImage.height;
            const w = document.getElementById('cropWidth').value / 100 * currentImage.width;
            const h = document.getElementById('cropHeight').value / 100 * currentImage.height;
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = w;
            tempCanvas.height = h;
            tempCtx.drawImage(currentImage, x, y, w, h, 0, 0, w, h);
            mainImage.src = tempCanvas.toDataURL();
            imageOverlay.textContent = `${Math.round(w)}×${Math.round(h)} (preview)`;
        }

        function previewResize() {
            const w = parseInt(document.getElementById('resizeWidth').value) || currentImage.width;
            let h = parseInt(document.getElementById('resizeHeight').value) || currentImage.height;
            if (document.getElementById('maintainAspect').checked) {
                h = Math.round(w / (currentImage.width / currentImage.height));
                document.getElementById('resizeHeight').value = h;
            }
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = w;
            tempCanvas.height = h;
            tempCtx.drawImage(currentImage, 0, 0, w, h);
            mainImage.src = tempCanvas.toDataURL();
            imageOverlay.textContent = `${w}×${h} (preview)`;
        }

        function previewAdjust() {
            const b = document.getElementById('brightness').value / 100;
            const c = document.getElementById('contrast').value / 100;
            const s = document.getElementById('saturation').value / 100;
            const bl = document.getElementById('blurAmount').value;
            const exp = document.getElementById('exposure').value / 100;
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = currentImage.width;
            tempCanvas.height = currentImage.height;
            tempCtx.filter =
                `brightness(${b}) contrast(${c}) saturate(${s}) blur(${bl}px) brightness(${1+exp})`;
            tempCtx.drawImage(currentImage, 0, 0);
            tempCtx.filter = 'none';
            mainImage.src = tempCanvas.toDataURL();
            imageOverlay.textContent = `${currentImage.width}×${currentImage.height} (adjusted)`;
        }

        function previewText() {
            const text = document.getElementById('textContent').value || 'Text';
            const size = parseInt(document.getElementById('textSize').value) || 36;
            const color = document.getElementById('textColor').value;
            const x = parseInt(document.getElementById('textX').value) || 50;
            const y = parseInt(document.getElementById('textY').value) || 80;
            const opacity = parseInt(document.getElementById('textOpacity').value) / 100 || 1;
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = currentImage.width;
            tempCanvas.height = currentImage.height;
            tempCtx.drawImage(currentImage, 0, 0);
            tempCtx.globalAlpha = opacity;
            tempCtx.font = `${size}px "Space Grotesk", sans-serif`;
            tempCtx.fillStyle = color;
            tempCtx.fillText(text, x, y);
            tempCtx.globalAlpha = 1;
            mainImage.src = tempCanvas.toDataURL();
            imageOverlay.textContent = `${currentImage.width}×${currentImage.height} (text)`;
        }

        function previewFrame() {
            const size = parseInt(document.getElementById('borderSize').value) || 10;
            const color = document.getElementById('borderColor').value || '#ffffff';
            const radius = parseInt(document.getElementById('cornerRadius').value) || 0;
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            const w = currentImage.width + size * 2;
            const h = currentImage.height + size * 2;
            tempCanvas.width = w;
            tempCanvas.height = h;
            // Draw rounded rect background
            tempCtx.fillStyle = color;
            if (radius > 0) {
                const r = Math.min(radius, w / 2, h / 2);
                tempCtx.beginPath();
                tempCtx.moveTo(r, 0);
                tempCtx.lineTo(w - r, 0);
                tempCtx.quadraticCurveTo(w, 0, w, r);
                tempCtx.lineTo(w, h - r);
                tempCtx.quadraticCurveTo(w, h, w - r, h);
                tempCtx.lineTo(r, h);
                tempCtx.quadraticCurveTo(0, h, 0, h - r);
                tempCtx.lineTo(0, r);
                tempCtx.quadraticCurveTo(0, 0, r, 0);
                tempCtx.closePath();
                tempCtx.fill();
            } else {
                tempCtx.fillRect(0, 0, w, h);
            }
            tempCtx.drawImage(currentImage, size, size);
            mainImage.src = tempCanvas.toDataURL();
            imageOverlay.textContent = `${w}×${h} (framed)`;
        }

        function previewWatermark() {
            const text = document.getElementById('wmText').value || '© Watermark';
            const size = parseInt(document.getElementById('wmSize').value) || 32;
            const opacity = parseInt(document.getElementById('wmOpacity').value) / 100 || 0.6;
            const pos = document.getElementById('wmPosition').value;
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = currentImage.width;
            tempCanvas.height = currentImage.height;
            tempCtx.drawImage(currentImage, 0, 0);
            tempCtx.globalAlpha = opacity;
            tempCtx.font = `${size}px "Space Grotesk", sans-serif`;
            tempCtx.fillStyle = '#ffffff';
            tempCtx.textAlign = 'center';
            tempCtx.textBaseline = 'middle';
            let cx = tempCanvas.width / 2,
                cy = tempCanvas.height / 2;
            const pad = 30;
            switch (pos) {
                case 'bottom-right':
                    cx = tempCanvas.width - pad;
                    cy = tempCanvas.height - pad;
                    tempCtx.textAlign = 'right';
                    tempCtx.textBaseline = 'bottom';
                    break;
                case 'bottom-left':
                    cx = pad;
                    cy = tempCanvas.height - pad;
                    tempCtx.textAlign = 'left';
                    tempCtx.textBaseline = 'bottom';
                    break;
                case 'top-right':
                    cx = tempCanvas.width - pad;
                    cy = pad;
                    tempCtx.textAlign = 'right';
                    tempCtx.textBaseline = 'top';
                    break;
                case 'top-left':
                    cx = pad;
                    cy = pad;
                    tempCtx.textAlign = 'left';
                    tempCtx.textBaseline = 'top';
                    break;
                default:
                    tempCtx.textAlign = 'center';
                    tempCtx.textBaseline = 'middle';
            }
            tempCtx.fillText(text, cx, cy);
            tempCtx.globalAlpha = 1;
            mainImage.src = tempCanvas.toDataURL();
            imageOverlay.textContent = `${currentImage.width}×${currentImage.height} (watermarked)`;
        }


        // ============================================
        // ADVANCED CREATIVE FEATURES
        // ============================================
        let compareOriginal = null;

        function setStatus(text) {
            const el = document.getElementById('statusText');
            if (el) el.textContent = text;
        }

        function updateMetadata() {
            const box = document.getElementById('metadataContent');
            if (!box) return;
            if (!currentImage) {
                box.textContent = 'Upload an image to inspect dimensions and workspace details.';
                return;
            }
            const mp = (currentImage.width * currentImage.height / 1000000).toFixed(2);
            box.innerHTML = `<strong style="color:#ddd">Dimensions</strong><br>${currentImage.width} × ${currentImage.height}px<br><br>
                <strong style="color:#ddd">Resolution</strong><br>${mp} megapixels<br><br>
                <strong style="color:#ddd">History</strong><br>${historyIndex + 1} / ${history.length} states`;
        }



        function previewEffects() {
            const vignette = Number(document.getElementById('vignette').value || 0);
            const pixelate = Number(document.getElementById('pixelate').value || 0);
            const noise = Number(document.getElementById('noise').value || 0);
            canvas.width=currentImage.width; canvas.height=currentImage.height;
            if(pixelate > 1) {
                const small=document.createElement('canvas');
                small.width=Math.max(1,Math.floor(canvas.width/pixelate));
                small.height=Math.max(1,Math.floor(canvas.height/pixelate));
                const sctx=small.getContext('2d');
                sctx.drawImage(currentImage,0,0,small.width,small.height);
                ctx.imageSmoothingEnabled=false;
                ctx.drawImage(small,0,0,small.width,small.height,0,0,canvas.width,canvas.height);
                ctx.imageSmoothingEnabled=true;
            } else ctx.drawImage(currentImage,0,0);

            const img=ctx.getImageData(0,0,canvas.width,canvas.height);
            const d=img.data, cx=canvas.width/2, cy=canvas.height/2, max=Math.hypot(cx,cy);
            for(let y=0;y<canvas.height;y++){
                for(let x=0;x<canvas.width;x++){
                    const i=(y*canvas.width+x)*4;
                    if(vignette){
                        const dist=Math.hypot(x-cx,y-cy)/max;
                        const factor=1-(dist*dist)*(vignette/100)*0.75;
                        d[i]*=factor; d[i+1]*=factor; d[i+2]*=factor;
                    }
                    if(noise){
                        const n=(Math.random()-.5)*noise;
                        d[i]=Math.max(0,Math.min(255,d[i]+n));
                        d[i+1]=Math.max(0,Math.min(255,d[i+1]+n));
                        d[i+2]=Math.max(0,Math.min(255,d[i+2]+n));
                    }
                }
            }
            ctx.putImageData(img,0,0);
            mainImage.src=canvas.toDataURL();
            imageOverlay.textContent=`${currentImage.width}×${currentImage.height} (effects preview)`;
        }

        function applyEffects() {
            previewEffects();
            updateImage(mainImage.src);
            toast('Effects applied');
            setStatus('Effects committed');
        }

        function applyPreset(name) {
            if (!currentImage) return toast('Upload an image first');
            canvas.width=currentImage.width; canvas.height=currentImage.height;
            const filters={
                portrait:'brightness(1.08) contrast(1.05) saturate(1.08)',
                cinematic:'brightness(.92) contrast(1.22) saturate(.82)',
                mono:'grayscale(1) contrast(1.15)',
                vivid:'brightness(1.04) contrast(1.16) saturate(1.45)'
            };
            ctx.filter=filters[name]; ctx.drawImage(currentImage,0,0); ctx.filter='none';
            updateImage(canvas.toDataURL());
            toast(name.charAt(0).toUpperCase()+name.slice(1)+' preset applied');
            setStatus(name+' preset applied');
        }

        function applyBackgroundCanvas() {
            if (!currentImage) return toast('Upload an image first');
            const pad=Number(document.getElementById('bgPadding')?.value || 0);
            const color=document.getElementById('bgColor')?.value || '#111111';
            canvas.width=currentImage.width+pad*2; canvas.height=currentImage.height+pad*2;
            ctx.fillStyle=color; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.drawImage(currentImage,pad,pad);
            updateImage(canvas.toDataURL());
            toast('Background canvas applied');
            setStatus('Background canvas created');
        }

        function makeSquareCanvas() {
            if (!currentImage) return toast('Upload an image first');
            const size=Math.max(currentImage.width,currentImage.height);
            const color=document.getElementById('bgColor')?.value || '#111111';
            canvas.width=size; canvas.height=size;
            ctx.fillStyle=color; ctx.fillRect(0,0,size,size);
            ctx.drawImage(currentImage,(size-currentImage.width)/2,(size-currentImage.height)/2);
            updateImage(canvas.toDataURL());
            toast('Square canvas created');
            setStatus('1:1 canvas created');
        }

        function toggleBeforeAfter() {
            if (!currentImage || !originalImage) return toast('Upload an image first');
            const comparing = mainImage.dataset.compare === 'true';
            if (!comparing) {
                compareOriginal = mainImage.src;
                mainImage.src = originalImage.src;
                mainImage.dataset.compare='true';
                document.getElementById('imageContainer').classList.add('compare-mode');
                document.getElementById('compareBtn').innerHTML='<i class="fa-solid fa-eye"></i> Edited';
                setStatus('Comparing original image');
            } else {
                mainImage.src = compareOriginal || currentImage.src;
                mainImage.dataset.compare='false';
                document.getElementById('imageContainer').classList.remove('compare-mode');
                document.getElementById('compareBtn').innerHTML='<i class="fa-solid fa-code-compare"></i> Compare';
                setStatus('Showing edited image');
            }
        }

        // ============================================
        // IMAGE UPLOAD
        // ============================================
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    originalImage = img;
                    currentImage = document.createElement('img');
                    currentImage.src = img.src;
                    currentImage.onload = function() {
                        mainImage.src = currentImage.src;
                        uploadPlaceholder.style.display = 'none';
                        imageContainer.style.display = 'block';
                        imageInfo.innerHTML =
                            `<span>${file.name}</span> <span>${currentImage.width}×${currentImage.height}</span> <span>${(file.size/1024).toFixed(1)} KB</span>`;
                        imageOverlay.textContent = `${currentImage.width}×${currentImage.height}`;
                        liveIndicator.style.display = 'none';
                        addToHistory(currentImage.src);
                    };
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ============================================
        // HISTORY
        // ============================================
        function addToHistory(src) {
            history = history.slice(0, historyIndex + 1);
            history.push(src);
            historyIndex = history.length - 1;
            updateHistoryButtons();
        }

        function undo() {
            if (historyIndex > 0) { historyIndex--;
                loadFromHistory(); }
        }

        function redo() {
            if (historyIndex < history.length - 1) { historyIndex++;
                loadFromHistory(); }
        }

        function loadFromHistory() {
            const src = history[historyIndex];
            currentImage.src = src;
            mainImage.src = src;
            currentImage.onload = () => {
                imageOverlay.textContent = `${currentImage.width}×${currentImage.height}`;
                liveIndicator.style.display = 'none';
            };
            updateHistoryButtons();
        }

        function updateHistoryButtons() {
            document.getElementById('undoBtn').disabled = historyIndex <= 0;
            document.getElementById('redoBtn').disabled = historyIndex >= history.length - 1;
        }

        // ============================================
        // UPDATE IMAGE (commit)
        // ============================================
        function updateImage(src) {
            const img = new Image();
            img.onload = function() {
                currentImage = img;
                mainImage.src = src;
                imageOverlay.textContent = `${img.width}×${img.height}`;
                liveIndicator.style.display = 'none';
                addToHistory(src);
            };
            img.src = src;
        }

        // ============================================
        // CROP
        // ============================================
        function updateCropPreview() {
            ['cropX', 'cropY', 'cropWidth', 'cropHeight'].forEach(id => {
                const el = document.getElementById(id);
                const label = document.getElementById(id + 'Val');
                if (el && label) label.innerText = el.value + '%';
            });
        }

        function applyCrop() {
            const x = document.getElementById('cropX').value / 100 * currentImage.width;
            const y = document.getElementById('cropY').value / 100 * currentImage.height;
            const w = document.getElementById('cropWidth').value / 100 * currentImage.width;
            const h = document.getElementById('cropHeight').value / 100 * currentImage.height;
            canvas.width = w;
            canvas.height = h;
            ctx.drawImage(currentImage, x, y, w, h, 0, 0, w, h);
            updateImage(canvas.toDataURL());
            toast('Crop applied');
        }

        // ============================================
        // RESIZE
        // ============================================
        function applyResize() {
            const w = parseInt(document.getElementById('resizeWidth').value);
            const h = parseInt(document.getElementById('resizeHeight').value);
            canvas.width = w;
            canvas.height = h;
            ctx.drawImage(currentImage, 0, 0, w, h);
            updateImage(canvas.toDataURL());
            toast('Resize applied');
        }

        // ============================================
        // FILTERS
        // ============================================
        function applyFilter(filter, btn) {
            if (!currentImage) { toast('Upload first'); return; }
            activeFilter = filter;
            // Highlight active
            document.querySelectorAll('.filter-badge').forEach(b => b.classList.remove('active-filter'));
            if (btn) btn.classList.add('active-filter');

            canvas.width = currentImage.width;
            canvas.height = currentImage.height;
            ctx.drawImage(currentImage, 0, 0);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i],
                    g = data[i + 1],
                    b = data[i + 2];
                switch (filter) {
                    case 'grayscale':
                        let gr = 0.3 * r + 0.59 * g + 0.11 * b;
                        data[i] = data[i + 1] = data[i + 2] = gr;
                        break;
                    case 'sepia':
                        data[i] = Math.min(255, r * 0.393 + g * 0.769 + b * 0.189);
                        data[i + 1] = Math.min(255, r * 0.349 + g * 0.686 + b * 0.168);
                        data[i + 2] = Math.min(255, r * 0.272 + g * 0.534 + b * 0.131);
                        break;
                    case 'invert':
                        data[i] = 255 - r;
                        data[i + 1] = 255 - g;
                        data[i + 2] = 255 - b;
                        break;
                    case 'blur':
                        data[i] = r * 0.7;
                        data[i + 1] = g * 0.7;
                        data[i + 2] = b * 0.7;
                        break;
                    case 'sharpen':
                        data[i] = Math.min(255, r * 1.3);
                        data[i + 1] = Math.min(255, g * 1.3);
                        data[i + 2] = Math.min(255, b * 1.3);
                        break;
                    case 'vintage':
                        data[i] = Math.min(255, r * 1.2);
                        data[i + 1] = g * 0.9;
                        data[i + 2] = b * 0.8;
                        break;
                    case 'warm':
                        data[i] = Math.min(255, r * 1.15);
                        data[i + 1] = g * 0.95;
                        data[i + 2] = b * 0.85;
                        break;
                    case 'cool':
                        data[i] = r * 0.9;
                        data[i + 1] = g * 0.95;
                        data[i + 2] = Math.min(255, b * 1.15);
                        break;
                }
            }
            ctx.putImageData(imgData, 0, 0);
            // Show live preview
            mainImage.src = canvas.toDataURL();
            imageOverlay.textContent = `${currentImage.width}×${currentImage.height} (${filter})`;
            liveIndicator.style.display = 'block';
            toast('Filter preview: ' + filter + ' — click Apply to commit');
        }

        // ============================================
        // ADJUST
        // ============================================
        function applyAdjustments() {
            canvas.width = currentImage.width;
            canvas.height = currentImage.height;
            const exp = document.getElementById('exposure').value / 100;
            ctx.filter =
                `brightness(${document.getElementById('brightness').value/100}) contrast(${document.getElementById('contrast').value/100}) saturate(${document.getElementById('saturation').value/100}) blur(${document.getElementById('blurAmount').value}px) brightness(${1+exp})`;
            ctx.drawImage(currentImage, 0, 0);
            ctx.filter = 'none';
            updateImage(canvas.toDataURL());
            toast('Adjustments applied');
        }

        // ============================================
        // ROTATE / FLIP
        // ============================================
        function rotateImage(deg) {
            if (!currentImage) { toast('Upload first'); return; }
            let w = currentImage.width,
                h = currentImage.height;
            if (deg === 90 || deg === -90 || deg === 270 || deg === -270) { canvas.width = h;
                canvas.height = w; } else { canvas.width = w;
                canvas.height = h; }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(deg * Math.PI / 180);
            ctx.drawImage(currentImage, -w / 2, -h / 2);
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            updateImage(canvas.toDataURL());
            toast('Rotated ' + deg + '°');
        }

        function flipImage(dir) {
            if (!currentImage) { toast('Upload first'); return; }
            canvas.width = currentImage.width;
            canvas.height = currentImage.height;
            ctx.translate(dir === 'horizontal' ? canvas.width : 0, dir === 'vertical' ? canvas.height : 0);
            ctx.scale(dir === 'horizontal' ? -1 : 1, dir === 'vertical' ? -1 : 1);
            ctx.drawImage(currentImage, 0, 0);
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            updateImage(canvas.toDataURL());
            toast('Flipped ' + dir);
        }

        // ============================================
        // TEXT (apply)
        // ============================================
        function applyText() {
            const text = document.getElementById('textContent').value || 'Text';
            const size = parseInt(document.getElementById('textSize').value) || 36;
            const color = document.getElementById('textColor').value;
            const x = parseInt(document.getElementById('textX').value) || 50;
            const y = parseInt(document.getElementById('textY').value) || 80;
            const opacity = parseInt(document.getElementById('textOpacity').value) / 100 || 1;
            canvas.width = currentImage.width;
            canvas.height = currentImage.height;
            ctx.drawImage(currentImage, 0, 0);
            ctx.globalAlpha = opacity;
            ctx.font = `${size}px "Space Grotesk", sans-serif`;
            ctx.fillStyle = color;
            ctx.fillText(text, x, y);
            ctx.globalAlpha = 1;
            updateImage(canvas.toDataURL());
            toast('Text added');
        }

        // ============================================
        // DRAW
        // ============================================
        function initDrawCanvas() {
            drawCanvas = document.getElementById('drawCanvas');
            drawCtx = drawCanvas.getContext('2d');
            drawCanvas.style.display = 'block';
            drawCanvas.width = drawCanvas.clientWidth || 600;
            drawCanvas.height = 400;
            drawCtx.fillStyle = '#0a0a0a';
            drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
            if (currentImage) drawCtx.drawImage(currentImage, 0, 0, drawCanvas.width, drawCanvas.height);
            drawCanvas.onmousedown = function(e) {
                isDrawing = true;
                const r = drawCanvas.getBoundingClientRect();
                lastX = e.clientX - r.left;
                lastY = e.clientY - r.top;
            };
            drawCanvas.onmousemove = function(e) {
                if (!isDrawing) return;
                const r = drawCanvas.getBoundingClientRect();
                const x = e.clientX - r.left,
                    y = e.clientY - r.top;
                drawCtx.beginPath();
                drawCtx.moveTo(lastX, lastY);
                drawCtx.lineTo(x, y);
                drawCtx.strokeStyle = document.getElementById('drawColor').value;
                drawCtx.lineWidth = document.getElementById('drawSize').value;
                drawCtx.lineCap = 'round';
                drawCtx.stroke();
                lastX = x;
                lastY = y;
            };
            drawCanvas.onmouseup = drawCanvas.onmouseout = function() { isDrawing = false; };
        }

        function clearDrawing() {
            if (!drawCtx) return;
            drawCtx.fillStyle = '#0a0a0a';
            drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
            if (currentImage) drawCtx.drawImage(currentImage, 0, 0, drawCanvas.width, drawCanvas.height);
        }

        function saveDrawing() {
            if (!drawCanvas) { toast('No drawing'); return; }
            const img = new Image();
            img.onload = function() {
                canvas.width = currentImage.width;
                canvas.height = currentImage.height;
                ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                updateImage(canvas.toDataURL());
                drawCanvas.style.display = 'none';
                toast('Drawing saved');
            };
            img.src = drawCanvas.toDataURL();
        }

        // ============================================
        // FRAME (apply)
        // ============================================
        function applyFrame() {
            const size = parseInt(document.getElementById('borderSize').value) || 10;
            const color = document.getElementById('borderColor').value || '#ffffff';
            const radius = parseInt(document.getElementById('cornerRadius').value) || 0;
            const w = currentImage.width + size * 2;
            const h = currentImage.height + size * 2;
            canvas.width = w;
            canvas.height = h;
            // Draw rounded rect
            if (radius > 0) {
                const r = Math.min(radius, w / 2, h / 2);
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.moveTo(r, 0);
                ctx.lineTo(w - r, 0);
                ctx.quadraticCurveTo(w, 0, w, r);
                ctx.lineTo(w, h - r);
                ctx.quadraticCurveTo(w, h, w - r, h);
                ctx.lineTo(r, h);
                ctx.quadraticCurveTo(0, h, 0, h - r);
                ctx.lineTo(0, r);
                ctx.quadraticCurveTo(0, 0, r, 0);
                ctx.closePath();
                ctx.fill();
            } else {
                ctx.fillStyle = color;
                ctx.fillRect(0, 0, w, h);
            }
            ctx.drawImage(currentImage, size, size);
            updateImage(canvas.toDataURL());
            toast('Frame applied');
        }

        // ============================================
        // WATERMARK (apply)
        // ============================================
        function applyWatermark() {
            const text = document.getElementById('wmText').value || '© Watermark';
            const size = parseInt(document.getElementById('wmSize').value) || 32;
            const opacity = parseInt(document.getElementById('wmOpacity').value) / 100 || 0.6;
            const pos = document.getElementById('wmPosition').value;
            canvas.width = currentImage.width;
            canvas.height = currentImage.height;
            ctx.drawImage(currentImage, 0, 0);
            ctx.globalAlpha = opacity;
            ctx.font = `${size}px "Space Grotesk", sans-serif`;
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            let cx = canvas.width / 2,
                cy = canvas.height / 2;
            const pad = 30;
            switch (pos) {
                case 'bottom-right':
                    cx = canvas.width - pad;
                    cy = canvas.height - pad;
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'bottom';
                    break;
                case 'bottom-left':
                    cx = pad;
                    cy = canvas.height - pad;
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'bottom';
                    break;
                case 'top-right':
                    cx = canvas.width - pad;
                    cy = pad;
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'top';
                    break;
                case 'top-left':
                    cx = pad;
                    cy = pad;
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'top';
                    break;
                default:
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
            }
            ctx.fillText(text, cx, cy);
            ctx.globalAlpha = 1;
            updateImage(canvas.toDataURL());
            toast('Watermark applied');
        }

        // ============================================
        // DOWNLOAD / RESET / EXPORT
        // ============================================
        function downloadImage() {
            if (!currentImage) { toast('No image'); return; }
            const a = document.createElement('a');
            a.download = 'image-studio-edit.png';
            a.href = mainImage.src;
            a.click();
            toast('Downloaded');
        }

        function exportImage() {
            if (!currentImage) { toast('No image'); return; }
            // Export with current preview
            const a = document.createElement('a');
            a.download = 'image-studio-export.png';
            a.href = mainImage.src;
            a.click();
            toast('Exported');
        }

        function resetAll() {
            if (originalImage) {
                currentImage = originalImage;
                mainImage.src = originalImage.src;
                imageOverlay.textContent = `${originalImage.width}×${originalImage.height}`;
                history = [originalImage.src];
                historyIndex = 0;
                updateHistoryButtons();
                liveIndicator.style.display = 'none';
                // Reset filter highlights
                document.querySelectorAll('.filter-badge').forEach(b => b.classList.remove('active-filter'));
                activeFilter = null;
                toast('Reset to original');
            } else { toast('No original image'); }
        }

        // ============================================
        // DRAG & DROP
        // ============================================
        uploadArea.addEventListener('dragover', e => { e.preventDefault();
            uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', e => { e.preventDefault();
            uploadArea.classList.remove('dragover'); });
        uploadArea.addEventListener('drop', e => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                const fake = { target: { files: [file] } };
                handleImageUpload(fake);
            } else toast('Please drop an image');
        });


        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                e.shiftKey ? redo() : undo();
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                downloadImage();
            }
        });

        // ============================================
        // INIT
        // ============================================
        toolProps.innerHTML = templates.crop;
    </script>

</body>
</html>
