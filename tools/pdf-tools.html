    <style>
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #eef3fc, #fbfeff);
            min-height: 100vh;
            padding: 20px 0;
        }
        .app-wrapper {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .google-ad-space {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
            border: 2px dashed #1d2b64;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .google-ad-placeholder {
            color: #1d2b64;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .app-header {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 16px 30px;
            margin-bottom: 30px;
            box-shadow: 0 15px 35px -10px rgba(0,20,60,0.15);
            border: 1px solid rgba(255,255,255,0.5);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            background: #1d2b64;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transform: rotate(10deg);
            transition: 0.3s;
        }
        
        .logo-icon:hover {
            transform: rotate(0deg) scale(1.1);
        }
        
        .logo-text h1 {
            font-weight: 700;
            font-size: 1.8rem;
            margin: 0;
            background: linear-gradient(135deg, #1d2b64, #2a3f8a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .logo-text p {
            margin: 0;
            font-size: 0.85rem;
            color: #666;
        }

        .editor-layout {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 20px;
            margin-bottom: 30px;
        }

        .tools-panel {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 15px 35px -10px rgba(0,20,60,0.15);
            height: fit-content;
        }

        .tools-header {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(29,43,100,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tools-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tool-btn {
            background: transparent;
            border: none;
            padding: 12px 15px;
            border-radius: 20px;
            text-align: left;
            font-weight: 500;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #333;
            width: 100%;
        }
        
        .tool-btn i {
            font-size: 1.4rem;
            width: 30px;
            color: #1d2b64;
        }
        
        .tool-btn:hover {
            background: rgba(29,43,100,0.1);
            transform: translateX(5px);
        }
        
        .tool-btn.active {
            background: #1d2b64;
            color: white;
        }
        
        .tool-btn.active i {
            color: white;
        }

        .canvas-panel {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 15px 35px -10px rgba(0,20,60,0.15);
            min-height: 500px;
        }

        .upload-area {
            background: #f8faff;
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            border: 3px dashed #1d2b64;
            transition: 0.3s;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        
        .upload-area:hover {
            background: #eef3ff;
            transform: scale(1.02);
        }
        
        .upload-area.dragover {
            background: #e0e8ff;
            border-color: #28a745;
        }

        .upload-content i {
            font-size: 5rem;
            color: #1d2b64;
            margin-bottom: 20px;
        }
        
        .upload-content h3 {
            font-weight: 700;
            color: #1d2b64;
        }

        .pdf-container {
            display: none;
            width: 100%;
        }

        .file-list {
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
        }

        .file-item {
            background: #f0f4fe;
            border-radius: 20px;
            padding: 12px 18px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.2s;
        }
        
        .file-item:hover {
            background: #e0e8ff;
        }

        .file-icon {
            font-size: 2rem;
            color: #1d2b64;
        }
        
        .file-details {
            flex: 1;
        }
        
        .file-name {
            font-weight: 600;
        }
        
        .file-meta {
            font-size: 0.8rem;
            color: #666;
        }

        .properties-panel {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 15px 35px -10px rgba(0,20,60,0.15);
            height: fit-content;
        }

        .prop-section {
            margin-bottom: 25px;
        }
        
        .prop-title {
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1d2b64;
        }

        .prop-control {
            margin-bottom: 15px;
        }
        
        .prop-control label {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 5px;
            display: block;
        }

        .range-slider {
            width: 100%;
            height: 6px;
            border-radius: 10px;
            background: #d0ddee;
            outline: none;
            -webkit-appearance: none;
        }
        
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #1d2b64;
            cursor: pointer;
            transition: 0.1s;
        }
        
        .range-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .tool-input, .tool-select, .tool-textarea {
            width: 100%;
            padding: 10px 15px;
            border-radius: 30px;
            border: 1px solid #d0ddee;
            background: white;
            font-weight: 500;
        }
        
        .tool-textarea {
            border-radius: 15px;
            resize: vertical;
            min-height: 80px;
            font-family: 'Courier New', monospace;
        }

        .btn-primary-custom {
            background: #1d2b64;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 12px;
            font-weight: 600;
            transition: 0.2s;
            width: 100%;
        }
        
        .btn-primary-custom:hover {
            background: #2f3e8a;
            transform: scale(1.02);
        }

        .bottom-toolbar {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 15px 25px;
            margin-top: 20px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 15px 35px -10px rgba(0,20,60,0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .pdf-info {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            color: #666;
        }
        
        .pdf-info span {
            font-weight: 600;
            color: #1d2b64;
        }

        .download-btn {
            background: #28a745;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 12px 30px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }
        
        .download-btn:hover {
            background: #34ce57;
            transform: scale(1.05);
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .dark-mode {
            background: #0f1a2f;
            color: #e2ecff;
        }
        
        .dark-mode .app-header,
        .dark-mode .tools-panel,
        .dark-mode .canvas-panel,
        .dark-mode .properties-panel,
        .dark-mode .bottom-toolbar {
            background: #1d2a44cc;
            border-color: #33415e;
            color: white;
        }
        
        .dark-mode .upload-area {
            background: #1e2a40;
            border-color: #4a5f8a;
        }
        
        .dark-mode .tool-btn {
            color: #e2ecff;
        }
        
        .dark-mode .tool-btn i {
            color: #8a9fd1;
        }
        
        .dark-mode .tool-btn.active {
            background: #2f3e8a;
        }
        
        .dark-mode .logo-text p {
            color: #aab8e0;
        }
        
        .dark-mode .google-ad-space {
            background: #1d2a44;
            border-color: #4a5f8a;
            color: #ffd700;
        }

        .toast-msg {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border-left: 8px solid #1d2b64;
            padding: 16px 30px;
            border-radius: 60px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            z-index: 99999;
            font-weight: 500;
            animation: slideIn 0.3s ease;
            max-width: 90%;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .image-preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        
        .image-preview-grid img {
            width: 100%;
            border-radius: 10px;
            border: 2px solid #e0e8ff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .text-preview {
            background: #f8faff;
            border-radius: 15px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 0.9rem;
            border: 1px solid #d0ddee;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
        }

        .file-type-badge {
            background: #1d2b64;
            color: white;
            border-radius: 30px;
            padding: 2px 12px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        @media (max-width: 1200px) {
            .editor-layout {
                grid-template-columns: 1fr;
            }
            
            .tools-panel .tools-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>

<body>
<div class="app-wrapper">

                <div class="upload-content" id="uploadPlaceholder">

                    <h3>Drop Files Here</h3>
                    <p class="text-muted">or click to browse (PDF, PNG, JPG)</p>

                <div class="pdf-container" id="pdfContainer">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0"><i class="bi bi-files me-2"></i>Uploaded Files</h5>
                        <button class="btn btn-sm btn-outline-danger" onclick="clearAllFiles()">
                            <i class="bi bi-trash"></i> Clear All
                        </button>
                    </div>

    </footer>

<script>
    // ==================== CONFIGURE PDF.JS ====================
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ==================== GLOBALS ====================
    let uploadedFiles = [];
    let currentTool = 'merge';
    let results = [];

    const uploadPlaceholder = document.getElementById('uploadPlaceholder');
    const pdfContainer = document.getElementById('pdfContainer');
    const fileList = document.getElementById('fileList');
    const fileInput = document.getElementById('fileInput');
    const pdfInfo = document.getElementById('pdfInfo');
    const pageCounter = document.getElementById('pageCounter');
    const applyBtn = document.getElementById('applyBtn');

    // ==================== UTILITIES ====================
    function showToast(m, isError = false) { 
        let t = document.createElement('div'); 
        t.className = 'toast-msg'; 
        if (isError) t.style.borderLeftColor = '#dc3545';
        t.innerText = m; 
        document.body.appendChild(t); 
        setTimeout(() => t.remove(), 4000); 
    }
    
    function toggleDarkMode() { 
        document.body.classList.toggle('dark-mode'); 
        const b = document.getElementById('darkBtn'); 
        b.innerHTML = document.body.classList.contains('dark-mode') ? 
            '<i class="bi bi-sun"></i> Light' : 
            '<i class="bi bi-moon"></i> Dark'; 
    }

    function setLoading(isLoading) {
        if (isLoading) {
            applyBtn.innerHTML = '<span class="loading-spinner me-2"></span>Processing...';
            applyBtn.disabled = true;
        } else {
            applyBtn.innerHTML = '<i class="bi bi-check2"></i> Apply Tool';
            applyBtn.disabled = false;
        }
    }

    function getFileExtension(filename) {
        return filename.split('.').pop().toLowerCase();
    }

    function formatFileSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
        return (bytes/1048576).toFixed(1) + ' MB';
    }

    function downloadBlob(data, filename, mimeType) {
        const blob = new Blob([data], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    function getElementValue(id) {
        const el = document.getElementById(id);
        return el ? el.value : '';
    }

    function getElementChecked(id) {
        const el = document.getElementById(id);
        return el ? el.checked : false;
    }

    function getElementInt(id, defaultVal = 0) {
        const el = document.getElementById(id);
        if (!el) return defaultVal;
        const val = parseInt(el.value);
        return isNaN(val) ? defaultVal : val;
    }

    function getElementFloat(id, defaultVal = 0) {
        const el = document.getElementById(id);
        if (!el) return defaultVal;
        const val = parseFloat(el.value);
        return isNaN(val) ? defaultVal : val;
    }

    // ==================== TOOL MANAGEMENT ====================
    const toolPropertiesTemplates = {
        merge: `
            <div class="prop-control">
                <label>Merge all PDFs into one file</label>
                <div class="form-text text-muted">All uploaded PDFs will be merged in order of upload</div>
            </div>
            <div class="prop-control">
                <label>Output filename:</label>
                <input class="tool-input" id="mergeFilename" value="merged.pdf">
            </div>
        `,
        split: `
            <div class="prop-control">
                <label>Split mode:</label>
                <select class="tool-select" id="splitMode" onchange="toggleSplitMode()">
                    <option value="range">Page range</option>
                    <option value="every">Every N pages</option>
                </select>
            </div>
            <div class="prop-control" id="splitRangeControl">
                <label>Pages (e.g., 1-3,5):</label>
                <input class="tool-input" id="splitPages" placeholder="1-3,5,7-9" value="1">
                <div class="form-text text-muted">Extract specific pages or ranges</div>
            </div>
            <div class="prop-control" id="splitEveryControl" style="display:none;">
                <label>Split every N pages:</label>
                <input type="number" class="tool-input" id="splitEvery" min="1" value="1">
            </div>
        `,
        compress: `
            <div class="prop-control">
                <label>Compression level:</label>
                <select class="tool-select" id="compressLevel">
                    <option value="0">Low (faster)</option>
                    <option value="1" selected>Medium</option>
                    <option value="2">High (smaller)</option>
                </select>
            </div>
            <div class="form-text text-muted">Higher compression = smaller file size</div>
        `,
        protect: `
            <div class="prop-control">
                <label>Password:</label>
                <input type="password" class="tool-input" id="protectPass" placeholder="Enter password">
                <div class="form-text text-muted">PDF will be encrypted with this password (AES-128)</div>
            </div>
            <div class="prop-control">
                <label>Confirm Password:</label>
                <input type="password" class="tool-input" id="protectPassConfirm" placeholder="Confirm password">
            </div>
        `,
        rotate: `
            <div class="prop-control">
                <label>Rotation angle:</label>
                <select class="tool-select" id="rotateAngle">
                    <option value="90">90° clockwise</option>
                    <option value="180">180°</option>
                    <option value="270">270° clockwise</option>
                </select>
            </div>
            <div class="prop-control">
                <label>Pages to rotate (leave empty for all):</label>
                <input class="tool-input" id="rotatePages" placeholder="e.g., 1,3-5">
                <div class="form-text text-muted">Leave empty to rotate all pages</div>
            </div>
        `,
        extract: `
            <div class="prop-control">
                <label>Pages to extract:</label>
                <input class="tool-input" id="extractPages" placeholder="e.g., 1,3-5" value="1">
                <div class="form-text text-muted">Specify pages or ranges to extract</div>
            </div>
            <div class="prop-control">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="extractAsSeparate">
                    <label class="form-check-label">Extract each page as separate PDF</label>
                </div>
            </div>
        `,
        watermark: `
            <div class="prop-control">
                <label>Watermark text:</label>
                <input class="tool-input" id="watermarkText" value="CONFIDENTIAL">
            </div>
            <div class="prop-control">
                <label>Opacity: <span id="watermarkOpacityValue">30%</span></label>
                <input type="range" class="range-slider" id="watermarkOpacity" min="0" max="100" value="30" 
                    oninput="document.getElementById('watermarkOpacityValue').innerText=this.value+'%'">
            </div>
            <div class="prop-control">
                <label>Font size: <span id="watermarkSizeValue">60</span></label>
                <input type="range" class="range-slider" id="watermarkSize" min="20" max="120" value="60" 
                    oninput="document.getElementById('watermarkSizeValue').innerText=this.value">
            </div>
        `,
        pdfimages: `
            <div class="prop-control">
                <label>Image format:</label>
                <select class="tool-select" id="imageFormat">
                    <option value="png">PNG</option>
                    <option value="jpeg">JPG</option>
                </select>
            </div>
            <div class="prop-control">
                <label>Image quality: <span id="imgQualityValue">90%</span></label>
                <input type="range" class="range-slider" id="imgQuality" min="10" max="100" value="90" 
                    oninput="document.getElementById('imgQualityValue').innerText=this.value+'%'">
            </div>
            <div class="prop-control">
                <label>Scale: <span id="imgScaleValue">2.0</span></label>
                <input type="range" class="range-slider" id="imgScale" min="0.5" max="4" step="0.1" value="2" 
                    oninput="document.getElementById('imgScaleValue').innerText=this.value">
            </div>
            <div class="form-text text-muted">Higher scale = better quality, larger files</div>
        `,
        extracttext: `
            <div class="prop-control">
                <label>Extract text from PDFs</label>
                <div class="form-text text-muted">All text content will be extracted and displayed</div>
            </div>
        `,
        imagestopdf: `
            <div class="prop-control">
                <label>Paper size:</label>
                <select class="tool-select" id="imagePaperSize">
                    <option value="a4">A4 (210×297mm)</option>
                    <option value="letter">Letter (8.5×11in)</option>
                    <option value="legal">Legal (8.5×14in)</option>
                    <option value="a3">A3 (297×420mm)</option>
                </select>
            </div>
            <div class="prop-control">
                <label>Output filename:</label>
                <input class="tool-input" id="imagesPdfFilename" value="images_to_pdf.pdf">
            </div>
            <div class="form-text text-muted">Upload PNG/JPG images to create a PDF</div>
        `,
        htmltopdf: `
            <div class="prop-control">
                <label>HTML content:</label>
                <textarea class="tool-textarea" id="htmlContent" rows="6">
<h1 style="color:#1d2b64;">Hello World</h1>
<p>This is a sample HTML page converted to PDF.</p>
<ul>
    <li>Bullet point 1</li>
    <li>Bullet point 2</li>
</ul>
<p style="color:#666;font-style:italic;">Generated by PDF Toolkit</p>
                </textarea>
            </div>
            <div class="prop-control">
                <label>Paper size:</label>
                <select class="tool-select" id="htmlPaperSize">
                    <option value="a4">A4</option>
                    <option value="letter">Letter</option>
                    <option value="legal">Legal</option>
                </select>
            </div>
            <div class="prop-control">
                <label>Output filename:</label>
                <input class="tool-input" id="htmlPdfFilename" value="html_to_pdf.pdf">
            </div>
        `
    };

    function toggleSplitMode() {
        const mode = document.getElementById('splitMode').value;
        const rangeControl = document.getElementById('splitRangeControl');
        const everyControl = document.getElementById('splitEveryControl');
        if (rangeControl) rangeControl.style.display = mode === 'range' ? 'block' : 'none';
        if (everyControl) everyControl.style.display = mode === 'every' ? 'block' : 'none';
    }

    function setActiveTool(btn, tool) {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTool = tool;
        document.getElementById('toolProperties').innerHTML = toolPropertiesTemplates[tool] || '<div class="text-center text-muted py-4">Settings</div>';
        document.getElementById('resultPreview').innerHTML = '';
        results = [];
        if (tool === 'split') {
            setTimeout(toggleSplitMode, 50);
        }
    }

    // ==================== UPLOAD ====================
    async function handleUpload(event) {
        const files = Array.from(event.target.files);
        if (files.length === 0) { showToast('Please select files', true); return; }
        setLoading(true);
        
        for (const file of files) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const ext = getFileExtension(file.name);
                let pages = 1;
                let isPDF = false;
                
                if (ext === 'pdf') {
                    isPDF = true;
                    try {
                        const { PDFDocument } = PDFLib;
                        const pdfDoc = await PDFDocument.load(arrayBuffer);
                        pages = pdfDoc.getPageCount();
                    } catch(e) {
                        pages = 1;
                    }
                }
                
                uploadedFiles.push({ 
                    file, 
                    name: file.name, 
                    size: file.size, 
                    pages: pages,
                    data: arrayBuffer,
                    type: ext,
                    isPDF: isPDF
                });
            } catch (error) {
                showToast(`Error loading ${file.name}: ${error.message}`, true);
            }
        }
        
        renderFileList();
        uploadPlaceholder.style.display = 'none';
        pdfContainer.style.display = 'block';
        updateInfo();
        setLoading(false);
        showToast(`Loaded ${files.length} file(s)`);
    }

    function renderFileList() {
        fileList.innerHTML = '';
        uploadedFiles.forEach((f, idx) => {
            const item = document.createElement('div');
            item.className = 'file-item';
            const icon = f.isPDF ? 'bi-file-pdf' : 'bi-file-image';
            const badge = f.isPDF ? '<span class="file-type-badge">PDF</span>' : '<span class="file-type-badge" style="background:#28a745;">IMAGE</span>';
            item.innerHTML = `
                <div class="file-icon"><i class="bi ${icon}"></i></div>
                <div class="file-details">
                    <div class="file-name">${f.name} ${badge}</div>
                    <div class="file-meta">${formatFileSize(f.size)} · ${f.pages} page${f.pages > 1 ? 's' : ''}</div>
                </div>
                <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="removeFile(${idx})"><i class="bi bi-x"></i></button>
            `;
            fileList.appendChild(item);
        });
    }

    function removeFile(index) {
        uploadedFiles.splice(index, 1);
        renderFileList();
        updateInfo();
        if (uploadedFiles.length === 0) {
            pdfContainer.style.display = 'none';
            uploadPlaceholder.style.display = 'block';
        }
    }

    function clearAllFiles() {
        uploadedFiles = [];
        results = [];
        renderFileList();
        pdfContainer.style.display = 'none';
        uploadPlaceholder.style.display = 'block';
        document.getElementById('resultPreview').innerHTML = '';
        updateInfo();
        showToast('All files cleared');
    }

    function updateInfo() {
        const totalPages = uploadedFiles.reduce((acc, f) => acc + f.pages, 0);
        const pdfCount = uploadedFiles.filter(f => f.isPDF).length;
        pdfInfo.innerHTML = `<span>${uploadedFiles.length} file(s)</span> <span>${pdfCount} PDF(s)</span> <span>${totalPages} total pages</span>`;
        pageCounter.innerText = `Total pages: ${totalPages}`;
    }

    // ==================== CORE PDF OPERATIONS ====================
    async function mergePDFs() {
        const { PDFDocument } = PDFLib;
        const mergedPdf = await PDFDocument.create();
        const filename = getElementValue('mergeFilename') || 'merged.pdf';
        
        for (const f of uploadedFiles) {
            if (!f.isPDF) continue;
            try {
                const pdfDoc = await PDFDocument.load(f.data);
                const pages = await mergedPdf.copyPages(pdfDoc, pdfDoc.getPageIndices());
                pages.forEach(p => mergedPdf.addPage(p));
            } catch(e) {
                showToast(`Error merging ${f.name}: ${e.message}`, true);
            }
        }
        return [{ name: filename, data: await mergedPdf.save(), type: 'pdf' }];
    }

    async function splitPDF() {
        const { PDFDocument } = PDFLib;
        const results = [];
        const mode = getElementValue('splitMode') || 'range';
        
        for (const f of uploadedFiles) {
            if (!f.isPDF) continue;
            const pdfDoc = await PDFDocument.load(f.data);
            const total = pdfDoc.getPageCount();
            
            if (mode === 'range') {
                const input = getElementValue('splitPages') || '1';
                const ranges = input.split(',').map(r => r.trim());
                for (const range of ranges) {
                    if (range.includes('-')) {
                        const [s, e] = range.split('-').map(Number);
                        for (let i = s; i <= e && i <= total; i++) {
                            const newPdf = await PDFDocument.create();
                            const [page] = await newPdf.copyPages(pdfDoc, [i-1]);
                            newPdf.addPage(page);
                            results.push({ 
                                name: `${f.name.replace('.pdf','')}_page_${i}.pdf`, 
                                data: await newPdf.save(),
                                type: 'pdf'
                            });
                        }
                    } else {
                        const p = Number(range);
                        if (p <= total) {
                            const newPdf = await PDFDocument.create();
                            const [page] = await newPdf.copyPages(pdfDoc, [p-1]);
                            newPdf.addPage(page);
                            results.push({ 
                                name: `${f.name.replace('.pdf','')}_page_${p}.pdf`, 
                                data: await newPdf.save(),
                                type: 'pdf'
                            });
                        }
                    }
                }
            } else {
                const everyN = getElementInt('splitEvery', 1);
                for (let i = 0; i < total; i += everyN) {
                    const newPdf = await PDFDocument.create();
                    const endIdx = Math.min(i + everyN, total);
                    const indices = Array.from({length: endIdx - i}, (_, idx) => i + idx);
                    const pages = await newPdf.copyPages(pdfDoc, indices);
                    pages.forEach(p => newPdf.addPage(p));
                    results.push({ 
                        name: `${f.name.replace('.pdf','')}_part_${Math.floor(i/everyN)+1}.pdf`, 
                        data: await newPdf.save(),
                        type: 'pdf'
                    });
                }
            }
        }
        return results;
    }

    async function compressPDF() {
        const { PDFDocument } = PDFLib;
        const results = [];
        const level = getElementInt('compressLevel', 1);
        
        for (const f of uploadedFiles) {
            if (!f.isPDF) continue;
            const pdfDoc = await PDFDocument.load(f.data);
            const bytes = await pdfDoc.save({ 
                useObjectStreams: level > 0,
                addDefaultPage: false
            });
            results.push({ 
                name: `compressed_${f.name}`, 
                data: bytes,
                type: 'pdf'
            });
        }
        return results;
    }

    // ==================== PROTECT PDF (FIXED) ====================
    async function protectPDF() {
        const { PDFDocument } = PDFLib;
        const password = getElementValue('protectPass');
        const confirm = getElementValue('protectPassConfirm');
        
        if (!password) { showToast('Please enter a password', true); return []; }
        if (password !== confirm) { showToast('Passwords do not match', true); return []; }
        if (password.length < 4) { showToast('Password must be at least 4 characters', true); return []; }
        
        const results = [];
        for (const f of uploadedFiles) {
            if (!f.isPDF) continue;
            try {
                const pdfDoc = await PDFDocument.load(f.data);
                // Encrypt with AES-128 - this creates a password-protected PDF
                const bytes = await pdfDoc.save({
                    password: password,
                    useObjectStreams: true,
                });
                results.push({ 
                    name: `protected_${f.name}`, 
                    data: bytes,
                    type: 'pdf',
                    password: password
                });
                showToast(`Protected ${f.name} with password: ${password}`, false);
            } catch(e) {
                showToast(`Error protecting ${f.name}: ${e.message}`, true);
            }
        }
        if (results.length === 0) {
            showToast('No PDFs were protected. Check your files.', true);
        } else {
            showToast(`Protected ${results.length} PDF(s) with password. Remember your password!`);
        }
        return results;
    }

    // ==================== ROTATE PDF (FIXED) ====================
    async function rotatePDF() {
        const { PDFDocument } = PDFLib;
        const angle = getElementInt('rotateAngle', 90);
        const input = getElementValue('rotatePages');
        const results = [];
        
        for (const f of uploadedFiles) {
            if (!f.isPDF) continue;
            try {
                const pdfDoc = await PDFDocument.load(f.data);
                const total = pdfDoc.getPageCount();
                let pagesToRotate = [];
                
                if (input.trim()) {
                    const ranges = input.split(',').map(r => r.trim());
                    for (const r of ranges) {
                        if (r.includes('-')) {
                            const [s, e] = r.split('-').map(Number);
                            for (let i = s; i <= e && i <= total; i++) pagesToRotate.push(i-1);
                        } else {
                            const p = Number(r);
                            if (p <= total && p > 0) pagesToRotate.push(p-1);
                        }
                    }
                } else {
                    pagesToRotate = pdfDoc.getPageIndices();
                }
                
                if (pagesToRotate.length === 0) {
                    showToast(`No valid pages to rotate in ${f.name}`, true);
                    continue;
                }
                
                for (const idx of pagesToRotate) {
                    const page = pdfDoc.getPage(idx);
                    const currentAngle = page.getRotation().angle || 0;
                    const newAngle = (currentAngle + angle) % 360;
                    page.setRotation({ angle: newAngle });
                }
                
                const rotatedBytes = await pdfDoc.save();
                results.push({ 
                    name: `rotated_${f.name}`, 
                    data: rotatedBytes,
                    type: 'pdf'
                });
                showToast(`Rotated ${pagesToRotate.length} pages in ${f.name} by ${angle}°`, false);
            } catch(e) {
                showToast(`Error rotating ${f.name}: ${e.message}`, true);
            }
        }
        if (results.length === 0) {
            showToast('No PDFs were rotated. Check your files and page numbers.', true);
        }
        return results;
    }

    async function extractPages() {
        const { PDFDocument } = PDFLib;
        const input = getElementValue('extractPages') || '1';
        const asSeparate = getElementChecked('extractAsSeparate');
        const results = [];
        
        for (const f of uploadedFiles) {
            if (!f.isPDF) continue;
            try {
                const pdfDoc = await PDFDocument.load(f.data);
                const total = pdfDoc.getPageCount();
                const ranges = input.split(',').map(r => r.trim());
                const pagesToExtract = [];
                
                for (const r of ranges) {
                    if (r.includes('-')) {
                        const [s, e] = r.split('-').map(Number);
                        for (let i = s; i <= e && i <= total; i++) pagesToExtract.push(i-1);
                    } else {
                        const p = Number(r);
                        if (p <= total && p > 0) pagesToExtract.push(p-1);
                    }
                }
                
                if (pagesToExtract.length === 0) {
                    showToast(`No valid pages to extract from ${f.name}`, true);
                    continue;
                }
                
                if (asSeparate) {
                    for (const idx of pagesToExtract) {
                        const newPdf = await PDFDocument.create();
                        const [page] = await newPdf.copyPages(pdfDoc, [idx]);
                        newPdf.addPage(page);
                        results.push({ 
                            name: `${f.name.replace('.pdf','')}_page_${idx+1}.pdf`, 
                            data: await newPdf.save(),
                            type: 'pdf'
                        });
                    }
                } else {
                    const newPdf = await PDFDocument.create();
                    const pages = await newPdf.copyPages(pdfDoc, pagesToExtract);
                    pages.forEach(p => newPdf.addPage(p));
                    results.push({ 
                        name: `extracted_${f.name}`, 
                        data: await newPdf.save(),
                        type: 'pdf'
                    });
                }
                showToast(`Extracted ${pagesToExtract.length} pages from ${f.name}`, false);
            } catch(e) {
                showToast(`Error extracting from ${f.name}: ${e.message}`, true);
            }
        }
        return results;
    }

    async function addWatermark() {
        const { PDFDocument, rgb } = PDFLib;
        const text = getElementValue('watermarkText') || 'WATERMARK';
        const opacity = getElementInt('watermarkOpacity', 30) / 100;
        const size = getElementInt('watermarkSize', 60);
        const results = [];
        
        for (const f of uploadedFiles) {
            if (!f.isPDF) continue;
            try {
                const pdfDoc = await PDFDocument.load(f.data);
                const pages = pdfDoc.getPages();
                pages.forEach(page => {
                    const { width, height } = page.getSize();
                    const textWidth = text.length * size * 0.4;
                    page.drawText(text, { 
                        x: (width - textWidth) / 2, 
                        y: height/2, 
                        size: size, 
                        opacity: opacity, 
                        color: rgb(0.5, 0.5, 0.5)
                    });
                });
                results.push({ 
                    name: `watermarked_${f.name}`, 
                    data: await pdfDoc.save(),
                    type: 'pdf'
                });
            } catch(e) {
                showToast(`Error watermarking ${f.name}: ${e.message}`, true);
            }
        }
        return results;
    }

    // ==================== PDF TO IMAGES (REAL) ====================
    async function pdfToImages() {
        const format = getElementValue('imageFormat') || 'png';
        const quality = getElementInt('imgQuality', 90) / 100;
        const scale = getElementFloat('imgScale', 2);
        const results = [];
        let previewHTML = '<div class="image-preview-grid">';
        
        for (const f of uploadedFiles) {
            if (!f.isPDF) continue;
            try {
                const arrayBuffer = f.data;
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const totalPages = pdf.numPages;
                
                for (let i = 1; i <= totalPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: scale });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    
                    const mimeType = format === 'jpeg' ? 'image/jpeg' : 'image/png';
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, mimeType, quality));
                    const data = await blob.arrayBuffer();
                    const imageUrl = URL.createObjectURL(blob);
                    
                    previewHTML += `<img src="${imageUrl}" alt="Page ${i}">`;
                    
                    const ext = format === 'jpeg' ? 'jpg' : format;
                    results.push({
                        name: `${f.name.replace('.pdf','')}_page_${i}.${ext}`,
                        data: data,
                        type: 'image',
                        preview: imageUrl
                    });
                }
            } catch(e) {
                showToast(`Error converting ${f.name}: ${e.message}`, true);
            }
        }
        
        if (results.length === 0) {
            showToast('No images were generated. Check your PDF files.', true);
        }
        
        previewHTML += '</div>';
        document.getElementById('resultPreview').innerHTML = previewHTML;
        return results;
    }

    // ==================== EXTRACT TEXT (FIXED) ====================
    async function extractText() {
        const results = [];
        let allText = '';
        
        for (const f of uploadedFiles) {
            if (!f.isPDF) continue;
            try {
                const arrayBuffer = f.data;
                // Use pdf.js to extract text
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const totalPages = pdf.numPages;
                let text = `=== ${f.name} ===\n`;
                
                for (let i = 1; i <= totalPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    const pageText = content.items.map(item => item.str).join(' ');
                    text += `\n--- Page ${i} ---\n${pageText}\n`;
                }
                
                allText += text + '\n\n';
                results.push({
                    name: `${f.name.replace('.pdf','')}_text.txt`,
                    data: new TextEncoder().encode(text).buffer,
                    type: 'text',
                    text: text
                });
                showToast(`Extracted ${totalPages} pages from ${f.name}`, false);
            } catch(e) {
                showToast(`Error extracting text from ${f.name}: ${e.message}`, true);
            }
        }
        
        if (results.length === 0) {
            showToast('No text was extracted. Check your PDF files.', true);
        }
        
        // Show preview
        const previewText = allText || 'No text found in PDFs';
        document.getElementById('resultPreview').innerHTML = `
            <h6 class="mt-3">Extracted Text:</h6>
            <div class="text-preview">${previewText}</div>
        `;
        return results;
    }

    // ==================== IMAGES TO PDF ====================
    async function imagesToPDF() {
        const { PDFDocument } = PDFLib;
        const pdfDoc = await PDFDocument.create();
        const paperSize = getElementValue('imagePaperSize') || 'a4';
        const filename = getElementValue('imagesPdfFilename') || 'images_to_pdf.pdf';
        
        let width, height;
        switch(paperSize) {
            case 'a4': width = 595; height = 842; break;
            case 'letter': width = 612; height = 792; break;
            case 'legal': width = 612; height = 1008; break;
            case 'a3': width = 842; height = 1191; break;
            default: width = 595; height = 842;
        }
        
        let imagesAdded = 0;
        for (const f of uploadedFiles) {
            if (f.isPDF) continue;
            try {
                const imageBytes = new Uint8Array(f.data);
                let image;
                try {
                    image = await pdfDoc.embedPng(imageBytes);
                } catch(e) {
                    try {
                        image = await pdfDoc.embedJpg(imageBytes);
                    } catch(e2) {
                        showToast(`Skipping ${f.name}: unsupported image format`, true);
                        continue;
                    }
                }
                
                const page = pdfDoc.addPage([width, height]);
                const imgWidth = Math.min(image.width, width - 40);
                const imgHeight = (imgWidth / image.width) * image.height;
                const x = (width - imgWidth) / 2;
                const y = (height - imgHeight) / 2;
                page.drawImage(image, { x, y, width: imgWidth, height: imgHeight });
                imagesAdded++;
            } catch(e) {
                showToast(`Error adding ${f.name}: ${e.message}`, true);
            }
        }
        
        if (imagesAdded === 0) {
            showToast('No images were added to the PDF. Upload PNG or JPG files.', true);
            return [];
        }
        
        return [{ name: filename, data: await pdfDoc.save(), type: 'pdf' }];
    }

    // ==================== HTML TO PDF ====================
    async function htmlToPDF() {
        const htmlContent = getElementValue('htmlContent') || '<h1>Hello</h1>';
        const paperSize = getElementValue('htmlPaperSize') || 'a4';
        const filename = getElementValue('htmlPdfFilename') || 'html_to_pdf.pdf';
        const { jsPDF } = window.jspdf;
        
        const container = document.createElement('div');
        container.innerHTML = htmlContent;
        container.style.cssText = 'position:absolute;left:-9999px;top:0;width:794px;padding:40px;background:#ffffff;';
        document.body.appendChild(container);
        
        try {
            await new Promise(resolve => setTimeout(resolve, 500));
            
            const canvas = await html2canvas(container, {
                scale: 2,
                useCORS: true,
                logging: false,
                backgroundColor: '#ffffff',
                width: 794,
                height: container.scrollHeight
            });
            
            let width, height;
            switch(paperSize) {
                case 'a4': width = 210; height = 297; break;
                case 'letter': width = 215.9; height = 279.4; break;
                case 'legal': width = 215.9; height = 355.6; break;
                default: width = 210; height = 297;
            }
            
            const doc = new jsPDF('p', 'mm', [width, height]);
            const imgData = canvas.toDataURL('image/jpeg', 0.92);
            const imgWidth = width - 20;
            const imgHeight = (canvas.height / canvas.width) * imgWidth;
            
            if (imgHeight <= height - 20) {
                doc.addImage(imgData, 'JPEG', 10, 10, imgWidth, imgHeight);
            } else {
                let remaining = imgHeight;
                let yOffset = 0;
                let pageNum = 0;
                const pageHeight = height - 20;
                while (remaining > 0) {
                    if (pageNum > 0) doc.addPage();
                    const section = document.createElement('div');
                    section.innerHTML = htmlContent;
                    section.style.cssText = `position:absolute;left:-9999px;top:0;width:794px;padding:40px;background:#ffffff;transform:translateY(-${yOffset}px);`;
                    document.body.appendChild(section);
                    await new Promise(resolve => setTimeout(resolve, 300));
                    const sectionCanvas = await html2canvas(section, { 
                        scale: 2, 
                        useCORS: true, 
                        backgroundColor: '#ffffff',
                        width: 794
                    });
                    const sectionData = sectionCanvas.toDataURL('image/jpeg', 0.92);
                    doc.addImage(sectionData, 'JPEG', 10, 10, imgWidth, pageHeight);
                    document.body.removeChild(section);
                    yOffset += pageHeight;
                    remaining -= pageHeight;
                    pageNum++;
                }
            }
            
            document.body.removeChild(container);
            const output = doc.output('arraybuffer');
            return [{ name: filename, data: output, type: 'pdf' }];
        } catch(e) {
            document.body.removeChild(container);
            showToast(`Error converting HTML: ${e.message}`, true);
            return [];
        }
    }

    // ==================== MAIN APPLY ====================
    async function applyTool() {
        if (currentTool !== 'htmltopdf' && uploadedFiles.length === 0) {
            showToast('Please upload files first', true);
            return;
        }
        if (currentTool === 'htmltopdf') {
            // HTML to PDF doesn't need uploaded files
        } else if (currentTool === 'imagestopdf') {
            const hasImages = uploadedFiles.some(f => !f.isPDF);
            if (!hasImages) {
                showToast('Please upload images (PNG/JPG) for this tool', true);
                return;
            }
        } else {
            const hasPDFs = uploadedFiles.some(f => f.isPDF);
            if (!hasPDFs) {
                showToast('Please upload PDF files for this tool', true);
                return;
            }
        }
        
        setLoading(true);
        results = [];
        document.getElementById('resultPreview').innerHTML = '';
        
        try {
            switch(currentTool) {
                case 'merge': results = await mergePDFs(); break;
                case 'split': results = await splitPDF(); break;
                case 'compress': results = await compressPDF(); break;
                case 'protect': results = await protectPDF(); break;
                case 'rotate': results = await rotatePDF(); break;
                case 'extract': results = await extractPages(); break;
                case 'watermark': results = await addWatermark(); break;
                case 'pdfimages': results = await pdfToImages(); break;
                case 'extracttext': results = await extractText(); break;
                case 'imagestopdf': results = await imagesToPDF(); break;
                case 'htmltopdf': results = await htmlToPDF(); break;
                default: showToast('Tool not implemented', true);
            }
            
            if (results && results.length > 0) {
                showToast(`Generated ${results.length} file(s)`);
                if (results.length === 1 && results[0].type === 'pdf') {
                    downloadBlob(results[0].data, results[0].name, 'application/pdf');
                }
            } else if (results && results.length === 0) {
                showToast('No results generated. Check your inputs.', true);
            }
        } catch (error) {
            showToast(`Error: ${error.message}`, true);
            console.error(error);
        }
        setLoading(false);
    }

    // ==================== DOWNLOAD RESULTS ====================
    function downloadAllResults() {
        if (results.length === 0) {
            if (uploadedFiles.length > 0) {
                uploadedFiles.forEach((f, idx) => {
                    setTimeout(() => {
                        const ext = f.isPDF ? 'application/pdf' : 'image/png';
                        downloadBlob(f.data, f.name, ext);
                    }, idx * 200);
                });
                showToast(`Downloading ${uploadedFiles.length} original files`);
            } else {
                showToast('No files to download', true);
            }
            return;
        }
        
        results.forEach((r, idx) => {
            setTimeout(() => {
                let mimeType = 'application/pdf';
                if (r.type === 'image') mimeType = r.name.endsWith('.png') ? 'image/png' : 'image/jpeg';
                if (r.type === 'text') mimeType = 'text/plain';
                downloadBlob(r.data, r.name, mimeType);
            }, idx * 300);
        });
        showToast(`Downloading ${results.length} result file(s)`);
    }

    // ==================== RESET ====================
    function resetAll() {
        uploadedFiles = [];
        results = [];
        renderFileList();
        pdfContainer.style.display = 'none';
        uploadPlaceholder.style.display = 'block';
        document.getElementById('resultPreview').innerHTML = '';
        pdfInfo.innerHTML = '<span>No files loaded</span>';
        showToast('Reset complete');
    }

    // ==================== DRAG & DROP ====================
    const uploadArea = document.getElementById('uploadArea');
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('dragover');
    });
    
    uploadArea.addEventListener('dragleave', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('dragover');
    });
    
    uploadArea.addEventListener('drop', async (e) => {
        e.preventDefault();
        uploadArea.classList.remove('dragover');
        const files = Array.from(e.dataTransfer.files);
        if (files.length) {
            const fakeEvent = { target: { files } };
            await handleUpload(fakeEvent);
        }
    });

    // ==================== INIT ====================
    document.getElementById('toolProperties').innerHTML = toolPropertiesTemplates.merge;
    showToast('PDF Toolkit loaded! Upload files and select a tool.');
</script>

<script id="mobile-download-hook">
(function(){
  const originalApply = window.applyTool;
  if (typeof originalApply === 'function' && !window.__mobileDownloadHooked) {
    window.__mobileDownloadHooked = true;
    window.applyTool = async function(){
      document.body.classList.remove('mobile-results-ready');
      const output = await originalApply.apply(this, arguments);
      if (Array.isArray(window.results) && window.results.length > 0) {
        document.body.classList.add('mobile-results-ready');
      }
      return output;
    };
  }
})();
</script>

                 document.querySelector('.main-panel') ||
