<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Resume Studio — Professional Resume Builder</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --ink: #111;
            --muted: #6b7280;
            --line: #e5e7eb;
            --paper: #fff;
            --soft: #f7f7f5;
            --accent: #111
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #f3f4f6;
            color: var(--ink);
            font-family: "DM Sans", sans-serif
        }

        button,
        input,
        textarea,
        select {
            font: inherit
        }

        .app {
            max-width: 1550px;
            margin: auto;
            padding: 18px
        }

        .top {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px
        }

        .brand {
            font-family: "Space Grotesk";
            font-size: 22px;
            font-weight: 700
        }

        .brand small {
            display: block;
            font-family: "DM Sans";
            font-size: 11px;
            color: var(--muted);
            font-weight: 600
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .btn {
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 9px;
            padding: 10px 13px;
            font-weight: 700;
            cursor: pointer
        }

        .btn.primary {
            background: #111;
            color: #fff;
            border-color: #111
        }

        .btn:disabled {
            opacity: .45;
            cursor: not-allowed
        }

        .layout {
            display: grid;
            grid-template-columns: 235px minmax(420px, 1fr) 360px;
            gap: 16px;
            align-items: start
        }

        .panel {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 16px;
            overflow: hidden
        }

        .sidebar {
            position: sticky;
            top: 16px;
            padding: 10px
        }

        .navbtn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 0;
            background: transparent;
            padding: 12px;
            border-radius: 9px;
            text-align: left;
            font-weight: 700;
            cursor: pointer
        }

        .navbtn.active {
            background: #111;
            color: #fff
        }

        .navbtn:hover {
            background: #f4f4f4
        }

        .navbtn.active:hover {
            background: #111
        }

        .previewWrap {
            min-height: calc(100vh - 125px);
            padding: 26px;
            background: #e8eaed;
            display: flex;
            justify-content: center;
            overflow: auto
        }

        .resume {
            width: 794px;
            min-height: 1123px;
            background: #fff;
            padding: 58px 62px;
            box-shadow: 0 14px 35px rgba(0, 0, 0, .12);
            transition: .18s
        }

        .resume h1 {
            font: 700 36px "Space Grotesk";
            margin: 0
        }

        .role {
            font-size: 17px;
            color: #555;
            margin-top: 5px
        }

        .contact {
            font-size: 12px;
            color: #555;
            margin-top: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap
        }

        .section {
            margin-top: 27px
        }

        .section h2 {
            font: 700 13px "Space Grotesk";
            text-transform: uppercase;
            letter-spacing: .12em;
            border-bottom: 2px solid #111;
            padding-bottom: 7px;
            margin: 0 0 11px
        }

        .item {
            margin: 0 0 15px
        }

        .itemtop {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-weight: 700
        }

        .sub {
            color: #555;
            font-size: 13px;
            margin-top: 2px
        }

        .desc {
            font-size: 13px;
            line-height: 1.6;
            margin: 6px 0 0
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 7px
        }

        .chip {
            font-size: 12px;
            border: 1px solid #d1d5db;
            border-radius: 99px;
            padding: 5px 9px
        }

        .template-elegant h1 {
            font-family: Georgia, serif;
            color: #25324a
        }

        .template-elegant .section h2 {
            border-color: #25324a;
            color: #25324a
        }

        .template-elegant {
            border-top: 10px solid #25324a
        }

        .template-modern {
            border-left: 12px solid #111
        }

        .template-minimal {
            padding: 72px
        }

        .template-minimal .section h2 {
            border-bottom: 1px solid #aaa
        }

        .template-creative h1 {
            font-size: 44px
        }

        .template-creative .section h2 {
            border: 0;
            background: #111;
            color: #fff;
            padding: 7px 10px
        }

        .editor {
            padding: 18px;
            position: sticky;
            top: 16px
        }

        .editor h3 {
            margin: 0 0 14px;
            font: 700 18px "Space Grotesk"
        }

        .field {
            margin: 0 0 12px
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin: 0 0 5px
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px;
            background: #fff
        }

        .field textarea {
            min-height: 100px;
            resize: vertical
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px
        }

        .itemCard {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            background: #fafafa
        }

        .itemCard .remove {
            float: right;
            color: #b91c1c
        }

        .add {
            width: 100%;
            margin-top: 6px
        }

        .stats {
            font-size: 12px;
            color: var(--muted);
            padding: 10px 0;
            border-top: 1px solid var(--line);
            margin-top: 12px
        }

        .ats {
            padding: 12px;
            border-radius: 10px;
            background: #f6f7f8;
            margin-bottom: 12px
        }

        .score {
            font: 700 34px "Space Grotesk"
        }

        .suggestions {
            font-size: 13px;
            line-height: 1.6
        }

        .toast {
            position: fixed;
            right: 18px;
            bottom: 18px;
            background: #111;
            color: #fff;
            padding: 11px 15px;
            border-radius: 9px;
            display: none;
            z-index: 20
        }

        @media(max-width:1100px) {
            .layout {
                grid-template-columns: 190px minmax(0, 1fr)
            }

            .editor {
                grid-column: 1/-1;
                position: static
            }

            .editor.panel {
                display: block
            }

            .previewWrap {
                min-height: auto
            }
        }

        @media(max-width:760px) {
            body {
                background: #fff
            }

            .app {
                padding: 0
            }

            .top {
                border-radius: 0;
                border-left: 0;
                border-right: 0;
                position: sticky;
                top: 0;
                z-index: 10
            }

            .top .actions {
                display: flex
            }

            .top .actions .btn {
                display: inline-block
            }

            .layout {
                display: flex;
                flex-direction: column;
                gap: 0
            }

            .sidebar {
                position: sticky;
                top: 68px;
                z-index: 9;
                width: 100%;
                padding: 0;
                border-radius: 0;
                border-left: 0;
                border-right: 0;
                overflow-x: auto
            }

            .sidebar {
                display: flex
            }

            .navbtn {
                flex: 0 0 auto;
                width: auto;
                border-radius: 0;
                white-space: nowrap
            }

            .previewWrap {
                order: 2;
                width: 100%;
                padding: 12px;
                background: #eef0f2;
                overflow: hidden
            }

            .resume {
                width: 100%;
                min-height: auto;
                padding: 34px 24px;
                box-shadow: none
            }

            .resume h1 {
                font-size: 29px
            }

            .editor {
                order: 3;
                width: 100%;
                border-radius: 0;
                border-left: 0;
                border-right: 0;
                padding: 16px;
                position: static
            }

            .top {
                margin: 0
            }

            .actions {
                justify-content: flex-end
            }

            .actions .primary {
                display: inline-block
            }

            .row {
                grid-template-columns: 1fr
            }

            .contact {
                display: block
            }

            .contact span {
                display: block;
                margin: 3px 0
            }

            .itemtop {
                display: block
            }

            .itemtop span:last-child {
                color: #666;
                font-size: 12px;
                margin-top: 3px
            }
        }

        @media print {
            body {
                background: #fff
            }

            .top,
            .sidebar,
            .editor,
            .toast {
                display: none !important
            }

            .app {
                padding: 0
            }

            .layout {
                display: block
            }

            .previewWrap {
                padding: 0;
                background: #fff
            }

            .resume {
                box-shadow: none;
                width: 100%;
                min-height: auto
            }
        }

        /* Additional professional templates */
        .template-executive {
            border-top: 14px solid #1b1b1b;
            padding: 64px 70px
        }

        .template-executive h1 {
            font-size: 42px;
            text-transform: uppercase;
            letter-spacing: .02em
        }

        .template-executive .section h2 {
            border-bottom: 3px solid #1b1b1b
        }

        .template-classic {
            font-family: Georgia, "Times New Roman", serif
        }

        .template-classic h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 38px
        }

        .template-classic .section h2 {
            font-family: Georgia, "Times New Roman", serif;
            border-bottom: 1px solid #333
        }

        .template-bold {
            border-left: 18px solid #111
        }

        .template-bold h1 {
            font-size: 46px
        }

        .template-bold .section h2 {
            background: #111;
            color: #fff;
            border: 0;
            padding: 8px 10px
        }

        .template-slate {
            border-top: 8px solid #444
        }

        .template-slate h1 {
            color: #222
        }

        .template-slate .section h2 {
            border-color: #666
        }

        .template-compact {
            padding: 42px 48px
        }

        .template-compact .section {
            margin-top: 18px
        }

        .template-compact .item {
            margin-bottom: 9px
        }

        .template-compact h1 {
            font-size: 31px
        }

        .template-portfolio {
            border-top: 22px solid #111
        }

        .template-portfolio h1 {
            font-size: 48px
        }

        .template-portfolio .chip {
            border-radius: 2px
        }
    </style>
</head>

<body>
    <div class="app">
        <header class="top">
            <div class="brand">Resume Studio<small>Live professional resume builder</small></div>
            <div class="actions"><button class="btn" id="undo">↶</button><button class="btn" id="redo">↷</button><button
                    class="btn" id="sample">Sample</button><button class="btn" id="pdf">PDF</button><button
                    class="btn primary" id="pdfTop">Download PDF</button></div>
        </header>
        <div class="layout">
            <nav class="panel sidebar" id="nav"></nav>
            <main class="panel previewWrap">
                <article class="resume template-modern" id="resume"></article>
            </main>
            <aside class="panel editor">
                <h3 id="editorTitle">Personal information</h3>
                <div id="editor"></div>
                <div class="stats" id="stats"></div>
            </aside>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
        const empty = () => ({ personal: { fullName: "", title: "", email: "", phone: "", location: "", summary: "" }, experience: [], education: [], skills: [], languages: [], certifications: [], template: "modern" });
        let data = empty(), active = "personal", history = [], hi = -1;
        const sections = [["personal", "Personal"], ["experience", "Experience"], ["education", "Education"], ["skills", "Skills"], ["languages", "Languages"], ["certifications", "Certifications"], ["templates", "Templates"], ["ats", "ATS Check"]];
        const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m]));
        function toast(t) { let e = document.querySelector("#toast"); e.textContent = t; e.style.display = "block"; setTimeout(() => e.style.display = "none", 2200) }
        function push() { const s = JSON.stringify(data); if (history[hi] === s) return; history = history.slice(0, hi + 1); history.push(s); hi = history.length - 1; buttons() }
        function buttons() { undo.disabled = hi <= 0; redo.disabled = hi >= history.length - 1 }
        function setActive(a) { active = a; renderNav(); renderEditor() }
        function renderNav() { nav.innerHTML = sections.map(([k, n]) => `<button class="navbtn ${k === active ? "active" : ""}" onclick="setActive('${k}')">${n}</button>`).join("") }
        function field(label, key, type = "text", value) { return `<div class="field"><label>${label}</label>${type === "textarea" ? `<textarea data-path="${key}">${esc(value)}</textarea>` : `<input type="${type}" data-path="${key}" value="${esc(value)}">`}</div>` }
        function bindInputs() { editor.querySelectorAll("[data-path]").forEach(el => el.oninput = () => { setPath(el.dataset.path, el.value); renderResume(); renderStats() }) }
        function setPath(path, val) { let p = path.split("."), o = data; for (let i = 0; i < p.length - 1; i++)o = o[p[i]]; o[p.at(-1)] = val }
        function personalEditor() { editor.innerHTML = field("Full name", "personal.fullName", "text", data.personal.fullName) + field("Professional title", "personal.title", "text", data.personal.title) + field("Email", "personal.email", "email", data.personal.email) + field("Phone", "personal.phone", "text", data.personal.phone) + field("Location", "personal.location", "text", data.personal.location) + field("Professional summary", "personal.summary", "textarea", data.personal.summary); bindInputs() }
        function arrayEditor(key, fields) { editor.innerHTML = data[key].map((it, i) => `<div class="itemCard"><button class="btn remove" onclick="removeItem('${key}',${i})">Remove</button>${fields.map(([label, k]) => field(label, `${key}.${i}.${k}`, "text", it[k])).join("")}</div>`).join("") + `<button class="btn primary add" onclick="addItem('${key}')">+ Add</button>`; bindInputs() }
        function skillsEditor() { editor.innerHTML = field("Skills (comma separated)", "skillsText", "textarea", data.skills.join(", ")); editor.querySelector("textarea").oninput = e => { data.skills = e.target.value.split(",").map(x => x.trim()).filter(Boolean); renderResume(); renderStats() } }
        function langsEditor() { arrayEditor("languages", [["Language", "name"], ["Proficiency", "proficiency"]]) }
        function templatesEditor() { editor.innerHTML = `<div class="field"><label>Choose template</label><select id="template">${["modern", "minimal", "elegant", "creative", "executive", "classic", "bold", "slate", "compact", "portfolio"].map(x => `<option ${data.template === x ? "selected" : ""}>${x}</option>`).join("")}</select></div><p class="suggestions">Templates update the preview immediately. Choose from 10 professional layouts.</p>`; template.onchange = e => { data.template = e.target.value; renderResume(); push() } }
        function atsScore() { let s = 0, p = data.personal; if (p.fullName) s += 10; if (p.email) s += 8; if (p.title) s += 7; if (p.summary.length >= 40) s += 15; if (data.experience.length) s += 20; if (data.education.length) s += 10; if (data.skills.length >= 5) s += 15; if (data.certifications.length) s += 5; if (data.languages.length) s += 5; return Math.min(100, s) }
        function atsEditor() { let s = atsScore(), a = []; if (!data.personal.summary) a.push("Add a professional summary."); if (data.experience.length < 1) a.push("Add relevant work experience."); if (data.skills.length < 5) a.push("Add at least five relevant skills."); if (!data.personal.email) a.push("Add a professional email address."); editor.innerHTML = `<div class="ats"><div class="score">${s}/100</div><strong>${s >= 85 ? "Excellent" : s >= 65 ? "Good" : "Needs improvement"}</strong></div><div class="suggestions">${a.length ? `<ul>${a.map(x => `<li>${x}</li>`).join("")}</ul>` : "Great coverage. Keep tailoring keywords to each job."}</div>` }
        function renderEditor() { editorTitle.textContent = sections.find(x => x[0] === active)[1]; if (active === "personal") personalEditor(); else if (active === "experience") arrayEditor("experience", [["Company", "company"], ["Position", "position"], ["Start", "startDate"], ["End", "endDate"], ["Description", "description"]]); else if (active === "education") arrayEditor("education", [["Institution", "institution"], ["Degree", "degree"], ["Start", "startDate"], ["End", "endDate"], ["GPA", "gpa"]]); else if (active === "skills") skillsEditor(); else if (active === "languages") langsEditor(); else if (active === "certifications") arrayEditor("certifications", [["Certification", "name"], ["Issuer", "issuer"], ["Year", "year"]]); else if (active === "templates") templatesEditor(); else atsEditor() }
        function addItem(k) { const defs = { experience: { company: "", position: "", startDate: "", endDate: "", description: "" }, education: { institution: "", degree: "", startDate: "", endDate: "", gpa: "" }, languages: { name: "", proficiency: "" }, certifications: { name: "", issuer: "", year: "" } }; data[k].push(defs[k]); renderEditor(); renderResume(); push() }
        function removeItem(k, i) { data[k].splice(i, 1); renderEditor(); renderResume(); push() }
        function renderResume() { const p = data.personal; resume.className = "resume template-" + data.template; let h = `<header><h1>${esc(p.fullName || "Your Name")}</h1><div class="role">${esc(p.title || "Professional Title")}</div><div class="contact">${[p.email, p.phone, p.location].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join("")}</div></header>`; if (p.summary) h += sec("Professional Summary", `<p class="desc">${esc(p.summary)}</p>`); if (data.experience.length) h += sec("Experience", data.experience.map(x => item(x.position, x.startDate && x.endDate ? x.startDate + " — " + x.endDate : "", x.company, x.description)).join("")); if (data.education.length) h += sec("Education", data.education.map(x => item(x.degree, x.startDate && x.endDate ? x.startDate + " — " + x.endDate : "", x.institution, x.gpa ? `GPA: ${x.gpa}` : "")).join("")); if (data.skills.length) h += sec("Skills", `<div class="chips">${data.skills.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div>`); if (data.languages.length) h += sec("Languages", `<div class="chips">${data.languages.map(x => `<span class="chip">${esc(x.name)}${x.proficiency ? " · " + esc(x.proficiency) : ""}</span>`).join("")}</div>`); if (data.certifications.length) h += sec("Certifications", data.certifications.map(x => `<div class="item"><strong>${esc(x.name)}</strong><div class="sub">${esc([x.issuer, x.year].filter(Boolean).join(" · "))}</div></div>`).join("")); resume.innerHTML = h }
        function sec(t, c) { return `<section class="section"><h2>${t}</h2>${c}</section>` } function item(a, b, c, d) { return `<div class="item"><div class="itemtop"><span>${esc(a)}</span><span>${esc(b)}</span></div><div class="sub">${esc(c)}</div>${d ? `<p class="desc">${esc(d)}</p>` : ""}</div>` }
        function renderStats() { stats.textContent = `${[data.personal.summary, data.experience.length, data.education.length, data.skills.length, data.languages.length, data.certifications.length].filter(Boolean).length} sections · ATS score ${atsScore()}/100` }
        editor.addEventListener("change", () => { push(); renderStats() }); editor.addEventListener("blur", e => { if (e.target.matches("input,textarea,select")) push() }, true)
        undo.onclick = () => { if (hi > 0) { data = JSON.parse(history[--hi]); renderAll(); buttons() } }; redo.onclick = () => { if (hi < history.length - 1) { data = JSON.parse(history[++hi]); renderAll(); buttons() } }
        sample.onclick = () => { data = { personal: { fullName: "Alex Morgan", title: "Senior Product Designer", email: "alex@example.com", phone: "+91 90000 00000", location: "Pune, India", summary: "Product designer with experience creating clear, accessible digital products and improving user journeys through research, prototyping, and measurable iteration." }, experience: [{ company: "Northstar Labs", position: "Senior Product Designer", startDate: "2023", endDate: "Present", description: "Led end-to-end product design and improved core workflow completion through iterative research and testing." }], education: [{ institution: "Design University", degree: "B.Des. Interaction Design", startDate: "2017", endDate: "2021", gpa: "" }], skills: ["Product Design", "Figma", "UX Research", "Prototyping", "Design Systems", "Accessibility"], languages: [{ name: "English", proficiency: "Professional" }], certifications: [{ name: "UX Certification", issuer: "Design Institute", year: "2024" }], template: "modern" }; push(); renderAll(); toast("Sample loaded") }

        function exportPDF() { if (!window.html2pdf) return toast("PDF library failed to load"); toast("Generating PDF…"); html2pdf().set({ margin: 0, filename: (data.personal.fullName || "Resume").replace(/\s+/g, "_") + ".pdf", html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: "mm", format: "a4" } }).from(resume).save() }
        pdfTop.onclick = exportPDF;
        function renderAll() { renderNav(); renderEditor(); renderResume(); renderStats() }
        push(); renderAll();
    </script>
</body>

</html>
