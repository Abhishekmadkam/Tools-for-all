<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Tools · Professional Suite</title>
  <!-- Bootstrap + icons + font -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
  <!-- PDF libraries for real merge/split -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <style>
    * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(145deg, #f0f4fb, #fafcff);
      min-height: 100vh;
      padding: 20px 0;
    }
    .app-wrapper {
      max-width: 1600px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Google Ad Spaces */
    .google-ad-space {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 20px;
      margin: 20px 0;
      text-align: center;
      border: 2px dashed #2c3e7a;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .google-ad-space:hover {
      background: #f0f5ff;
    }
    .google-ad-placeholder {
      color: #2c3e7a;
      font-weight: 600;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Modern Header */
    .app-header {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 16px 30px;
      margin-bottom: 30px;
      box-shadow: 0 15px 35px -10px rgba(0,20,60,0.12);
      border: 1px solid rgba(255,255,255,0.5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      background: linear-gradient(135deg, #2c3e7a, #1a2a5c);
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      transition: 0.3s;
    }
    .logo-icon:hover {
      transform: rotate(-6deg) scale(1.1);
    }
    .logo-text h1 {
      font-weight: 700;
      font-size: 1.8rem;
      margin: 0;
      background: linear-gradient(135deg, #2c3e7a, #1a2a5c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo-text p {
      margin: 0;
      font-size: 0.85rem;
      color: #666;
    }

    /* Main Layout - 3 Column */
    .editor-layout {
      display: grid;
      grid-template-columns: 280px 1fr 320px;
      gap: 20px;
      margin-bottom: 30px;
    }

    /* Left Toolbar */
    .tools-panel {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 15px 35px -10px rgba(0,20,60,0.12);
      height: fit-content;
    }

    .tools-header {
      font-weight: 700;
      font-size: 1.2rem;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid rgba(44,62,122,0.08);
      display: flex;
      align-items: center;
      gap: 10px;
      color: #2c3e7a;
    }

    .tools-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tool-btn {
      background: transparent;
      border: none;
      padding: 12px 15px;
      border-radius: 20px;
      text-align: left;
      font-weight: 500;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #333;
      width: 100%;
    }
    .tool-btn i {
      font-size: 1.4rem;
      width: 30px;
      color: #2c3e7a;
    }
    .tool-btn:hover {
      background: rgba(44,62,122,0.08);
      transform: translateX(5px);
    }
    .tool-btn.active {
      background: linear-gradient(135deg, #2c3e7a, #1a2a5c);
      color: white;
    }
    .tool-btn.active i {
      color: white;
    }

    /* Center Panel */
    .canvas-panel {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 15px 35px -10px rgba(0,20,60,0.12);
      min-height: 500px;
    }

    .upload-area {
      background: #f8faff;
      border-radius: 25px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      border: 3px dashed #2c3e7a;
      transition: 0.3s;
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .upload-area:hover {
      background: #eef3ff;
      transform: scale(1.01);
    }
    .upload-area.dragover {
      background: #e0e8ff;
      border-color: #28a745;
    }

    .upload-content i {
      font-size: 5rem;
      color: #2c3e7a;
      margin-bottom: 20px;
    }
    .upload-content h3 {
      font-weight: 700;
      color: #2c3e7a;
    }

    .pdf-container {
      display: none;
    }
    .file-list {
      max-height: 400px;
      overflow-y: auto;
      padding: 10px;
    }
    .file-item {
      background: #f0f4fe;
      border-radius: 20px;
      padding: 12px 18px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: 0.2s;
    }
    .file-item:hover {
      background: #e0e8ff;
    }
    .file-icon { font-size: 2rem; color: #2c3e7a; }
    .file-details { flex: 1; }
    .file-name { font-weight: 600; }
    .file-meta { font-size: 0.8rem; color: #666; }

    /* Right Properties Panel */
    .properties-panel {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 15px 35px -10px rgba(0,20,60,0.12);
      height: fit-content;
    }

    .prop-section { margin-bottom: 25px; }
    .prop-title {
      font-weight: 600;
      margin-bottom: 15px;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #2c3e7a;
    }
    .prop-control { margin-bottom: 15px; }
    .prop-control label {
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 5px;
      display: block;
    }

    .range-slider {
      width: 100%;
      height: 6px;
      border-radius: 10px;
      background: #d0ddee;
      outline: none;
      -webkit-appearance: none;
    }
    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #2c3e7a;
      cursor: pointer;
      transition: 0.1s;
    }
    .range-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .tool-input, .tool-select {
      width: 100%;
      padding: 10px 15px;
      border-radius: 30px;
      border: 1.5px solid #d0ddee;
      background: white;
      font-weight: 500;
    }
    .tool-input:focus, .tool-select:focus {
      border-color: #2c3e7a;
      box-shadow: 0 0 0 3px rgba(44,62,122,0.12);
      outline: none;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }
    .btn-primary-custom {
      background: linear-gradient(135deg, #2c3e7a, #1a2a5c);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 12px;
      font-weight: 600;
      transition: 0.2s;
    }
    .btn-primary-custom:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 20px rgba(44,62,122,0.3);
    }
    .btn-secondary-custom {
      background: #ecf2fc;
      color: #2c3e7a;
      border: none;
      border-radius: 20px;
      padding: 12px;
      font-weight: 600;
      transition: 0.2s;
    }
    .btn-secondary-custom:hover {
      background: #d0ddee;
    }

    /* Bottom Toolbar */
    .bottom-toolbar {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 15px 25px;
      margin-top: 20px;
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 15px 35px -10px rgba(0,20,60,0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }

    .pdf-info {
      display: flex;
      gap: 20px;
      font-size: 0.9rem;
      color: #666;
    }
    .pdf-info span {
      font-weight: 600;
      color: #2c3e7a;
    }

    .download-btn {
      background: #28a745;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 12px 30px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.2s;
    }
    .download-btn:hover {
      background: #34ce57;
      transform: scale(1.04);
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Toast */
    .toast-msg {
      position: fixed;
      top: 20px;
      right: 20px;
      background: white;
      border-left: 8px solid #2c3e7a;
      padding: 16px 30px;
      border-radius: 60px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
      z-index: 99999;
      font-weight: 500;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Responsive */
    @media (max-width: 1200px) {
      .editor-layout { grid-template-columns: 1fr; }
      .tools-panel .tools-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
    }
    @media (max-width: 576px) {
      .app-header { padding: 12px 18px; }
      .logo-text h1 { font-size: 1.3rem; }
      .upload-area { padding: 20px; min-height: 250px; }
    }
  </style>
</head>
<body>
<div class="app-wrapper">

  <!-- GOOGLE AD SPACE - TOP -->
  <div class="google-ad-space">
    <div class="google-ad-placeholder">
      <i class="bi bi-google" style="font-size:1.8rem;"></i>
      <span>Google AdSense Space (Top)</span>
    </div>
  </div>

  <!-- Header -->
  <div class="app-header">
    <div class="logo">
      <div class="logo-icon"><i class="bi bi-mortarboard-fill"></i></div>
      <div class="logo-text">
        <h1>Student Tools</h1>
        <p>Professional Academic Suite</p>
      </div>
    </div>
    <div class="d-flex gap-3">
      <button class="btn btn-outline-secondary rounded-pill" onclick="toggleDarkMode()" id="darkBtn">
        <i class="bi bi-moon"></i> Dark
      </button>
      <button class="btn btn-outline-primary rounded-pill" onclick="resetAll()">
        <i class="bi bi-arrow-counterclockwise"></i> Reset
      </button>
    </div>
  </div>

  <!-- Main Editor Layout -->
  <div class="editor-layout">
    <!-- Left Tools Panel -->
    <div class="tools-panel">
      <div class="tools-header">
        <i class="bi bi-tools"></i>
        <span>Student Tools</span>
      </div>
      <div class="tools-grid">
        <button class="tool-btn active" onclick="setActiveTool(this, 'cgpa')">
          <i class="bi bi-calculator-fill"></i><span>CGPA Calculator</span>
        </button>
        <button class="tool-btn" onclick="setActiveTool(this, 'percentage')">
          <i class="bi bi-percent"></i><span>Percentage</span>
        </button>
        <button class="tool-btn" onclick="setActiveTool(this, 'wordcounter')">
          <i class="bi bi-chart-bar"></i><span>Word Counter</span>
        </button>
        <button class="tool-btn" onclick="setActiveTool(this, 'unitconverter')">
          <i class="bi bi-arrow-left-right"></i><span>Unit Converter</span>
        </button>
        <button class="tool-btn" onclick="setActiveTool(this, 'scientific')">
          <i class="bi bi-symmetry-vertical"></i><span>Scientific Calc</span>
        </button>
        <button class="tool-btn" onclick="setActiveTool(this, 'pdfmerger')">
          <i class="bi bi-file-earmark-pdf-fill"></i><span>PDF Merger</span>
        </button>
        <button class="tool-btn" onclick="setActiveTool(this, 'pdfsplitter')">
          <i class="bi bi-scissors"></i><span>PDF Splitter</span>
        </button>
        <button class="tool-btn" onclick="setActiveTool(this, 'textformatter')">
          <i class="bi bi-textarea-t"></i><span>Text Formatter</span>
        </button>
        <button class="tool-btn" onclick="setActiveTool(this, 'passwordgen')">
          <i class="bi bi-shield-lock-fill"></i><span>Password Generator</span>
        </button>
        <button class="tool-btn" onclick="setActiveTool(this, 'studytimer')">
          <i class="bi bi-clock-history"></i><span>Study Timer</span>
        </button>
      </div>
      <div class="mt-4">
        <button class="btn-primary-custom w-100" onclick="applyTool()" id="applyBtn">
          <i class="bi bi-play-fill"></i> Run Tool
        </button>
      </div>
    </div>

    <!-- Center Panel -->
    <div class="canvas-panel">
      <div id="toolContent">
        <!-- Dynamic content will be rendered here -->
      </div>
    </div>

    <!-- Right Properties Panel -->
    <div class="properties-panel" id="propertiesPanel">
      <div class="prop-section">
        <div class="prop-title">
          <i class="bi bi-sliders2"></i>
          <span>Settings</span>
        </div>
        <div id="toolProperties">
          <div class="text-center text-muted py-4">Select a tool to configure</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Toolbar -->
  <div class="bottom-toolbar">
    <div class="pdf-info" id="statusInfo">
      <span>Ready</span>
    </div>
    <button class="download-btn" onclick="downloadResults()">
      <i class="bi bi-download"></i>
      <span>Download Results</span>
    </button>
  </div>

  <!-- GOOGLE AD SPACE - BOTTOM -->
  <div class="google-ad-space mt-4">
    <div class="google-ad-placeholder">
      <i class="bi bi-google" style="font-size:1.8rem;"></i>
      <span>Google AdSense Space (Bottom)</span>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center small text-muted mt-4">
    Student Tools · Complete Academic Suite (fully working)
  </footer>
</div>

<script>
  // ==================== GLOBALS ====================
  let currentTool = 'cgpa';
  let processedResults = [];

  // DOM refs
  const toolContent = document.getElementById('toolContent');
  const toolProperties = document.getElementById('toolProperties');
  const statusInfo = document.getElementById('statusInfo');
  const applyBtn = document.getElementById('applyBtn');

  // ==================== UTILITIES ====================
  function showToast(m, isError = false) {
    let t = document.createElement('div');
    t.className = 'toast-msg';
    if (isError) t.style.borderLeftColor = '#dc3545';
    t.innerText = m;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    const b = document.getElementById('darkBtn');
    b.innerHTML = document.body.classList.contains('dark-mode') ?
      '<i class="bi bi-sun"></i> Light' :
      '<i class="bi bi-moon"></i> Dark';
  }

  function setLoading(isLoading) {
    if (isLoading) {
      applyBtn.innerHTML = '<span class="loading-spinner me-2"></span>Processing...';
      applyBtn.disabled = true;
    } else {
      applyBtn.innerHTML = '<i class="bi bi-play-fill"></i> Run Tool';
      applyBtn.disabled = false;
    }
  }

  // ==================== TOOL MANAGEMENT ====================
  const toolContentTemplates = {
    cgpa: `
      <h4 class="mb-3"><i class="bi bi-calculator-fill me-2"></i>CGPA Calculator</h4>
      <div class="mb-3">
        <input type="number" class="form-control" id="prevCgpa" placeholder="Previous CGPA (e.g., 7.5)" step="0.01">
      </div>
      <div class="mb-3">
        <input type="number" class="form-control" id="prevCredits" placeholder="Total credits so far" step="1">
      </div>
      <div class="mb-3">
        <input type="number" class="form-control" id="newGpa" placeholder="New semester GPA" step="0.01">
      </div>
      <div class="mb-3">
        <input type="number" class="form-control" id="newCredits" placeholder="New semester credits" step="1">
      </div>
      <div id="cgpaResult" class="result-display p-3 bg-light rounded-4 text-center fw-bold">—</div>
    `,
    percentage: `
      <h4 class="mb-3"><i class="bi bi-percent me-2"></i>Percentage Calculator</h4>
      <div class="mb-3">
        <input type="number" class="form-control" id="percValue" placeholder="Value (e.g., 200)">
      </div>
      <div class="mb-3">
        <input type="number" class="form-control" id="percOf" placeholder="Percentage (e.g., 15)">
      </div>
      <div id="percResult" class="result-display p-3 bg-light rounded-4 text-center fw-bold">—</div>
    `,
    wordcounter: `
      <h4 class="mb-3"><i class="bi bi-chart-bar me-2"></i>Word Counter</h4>
      <div class="mb-3">
        <textarea class="form-control" id="wordText" rows="5" placeholder="Type or paste text..."></textarea>
      </div>
      <div id="wordResult" class="result-display p-3 bg-light rounded-4 text-center fw-bold">words: 0 | chars: 0</div>
    `,
    unitconverter: `
      <h4 class="mb-3"><i class="bi bi-arrow-left-right me-2"></i>Unit Converter</h4>
      <div class="mb-3">
        <input type="number" class="form-control" id="unitInput" placeholder="Enter value">
      </div>
      <div class="row g-2 mb-3">
        <div class="col">
          <select class="form-select" id="fromUnit">
            <option value="m">meters</option>
            <option value="km">km</option>
            <option value="cm">cm</option>
            <option value="mm">mm</option>
          </select>
        </div>
        <div class="col">
          <select class="form-select" id="toUnit">
            <option value="km">km</option>
            <option value="m">meters</option>
            <option value="cm">cm</option>
            <option value="mm">mm</option>
          </select>
        </div>
      </div>
      <div id="unitResult" class="result-display p-3 bg-light rounded-4 text-center fw-bold">—</div>
    `,
    scientific: `
      <h4 class="mb-3"><i class="bi bi-symmetry-vertical me-2"></i>Scientific Calculator</h4>
      <div class="mb-3">
        <input type="number" class="form-control" id="sciNum" placeholder="Enter number">
      </div>
      <div class="d-flex gap-2 flex-wrap mb-3">
        <button class="btn btn-outline-primary rounded-pill px-4" onclick="sciOp('sqrt')">√</button>
        <button class="btn btn-outline-primary rounded-pill px-4" onclick="sciOp('sin')">sin</button>
        <button class="btn btn-outline-primary rounded-pill px-4" onclick="sciOp('cos')">cos</button>
        <button class="btn btn-outline-primary rounded-pill px-4" onclick="sciOp('log')">log₁₀</button>
        <button class="btn btn-outline-primary rounded-pill px-4" onclick="sciOp('square')">x²</button>
      </div>
      <div id="sciResult" class="result-display p-3 bg-light rounded-4 text-center fw-bold">—</div>
    `,
    pdfmerger: `
      <h4 class="mb-3"><i class="bi bi-file-earmark-pdf-fill me-2"></i>PDF Merger</h4>
      <p class="text-muted">Select up to 5 PDF files to merge (order by selection).</p>
      <div class="mb-3">
        <input type="file" class="form-control" id="mergeFiles" accept=".pdf" multiple>
      </div>
      <div id="mergeStatus" class="result-display p-3 bg-light rounded-4 text-center">waiting for files...</div>
    `,
    pdfsplitter: `
      <h4 class="mb-3"><i class="bi bi-scissors me-2"></i>PDF Splitter</h4>
      <p class="text-muted">Select a PDF and enter page range (e.g., 1-3).</p>
      <div class="mb-3">
        <input type="file" class="form-control" id="splitFile" accept=".pdf">
      </div>
      <div class="mb-3">
        <input type="text" class="form-control" id="pageRange" placeholder="range e.g. 2-5">
      </div>
      <div id="splitStatus" class="result-display p-3 bg-light rounded-4 text-center">—</div>
    `,
    textformatter: `
      <h4 class="mb-3"><i class="bi bi-textarea-t me-2"></i>Text Formatter</h4>
      <div class="mb-3">
        <textarea class="form-control" id="rawText" rows="4" placeholder="Enter text..."></textarea>
      </div>
      <div class="d-flex gap-2 flex-wrap mb-3">
        <button class="btn btn-outline-primary rounded-pill px-4" onclick="formatText('upper')">UPPERCASE</button>
        <button class="btn btn-outline-primary rounded-pill px-4" onclick="formatText('lower')">lowercase</button>
        <button class="btn btn-outline-primary rounded-pill px-4" onclick="formatText('trim')">trim spaces</button>
      </div>
      <div id="formattedResult" class="result-display p-3 bg-light rounded-4">—</div>
    `,
    passwordgen: `
      <h4 class="mb-3"><i class="bi bi-shield-lock-fill me-2"></i>Password Generator</h4>
      <div class="mb-3">
        <label class="fw-medium">Password Length:</label>
        <input type="number" class="form-control" id="passLen" value="12" min="4" max="30">
      </div>
      <div id="passResult" class="result-display p-3 bg-light rounded-4 text-center fw-bold">—</div>
    `,
    studytimer: `
      <h4 class="mb-3"><i class="bi bi-clock-history me-2"></i>Study Timer</h4>
      <div class="mb-3 d-flex align-items-center gap-3 flex-wrap">
        <label class="fw-medium">Minutes:</label>
        <input type="number" id="timerMinutes" class="form-control d-inline-block w-auto" value="25" min="1" max="180" style="max-width:100px;">
      </div>
      <div id="timerDisplay" class="display-4 fw-bold text-center mb-3">25:00</div>
      <div class="d-flex gap-2 justify-content-center flex-wrap">
        <button class="btn btn-primary rounded-pill px-4" onclick="startTimer()">Start</button>
        <button class="btn btn-outline-secondary rounded-pill px-4" onclick="resetTimer()">Reset</button>
        <button class="btn btn-outline-secondary rounded-pill px-4" onclick="pauseTimer()">Pause</button>
      </div>
    `
  };

  const toolPropertiesTemplates = {
    cgpa: `
      <div class="prop-control">
        <label>Grade Scale:</label>
        <select class="tool-select">
          <option>4.0 Scale</option>
          <option>10.0 Scale</option>
        </select>
      </div>
    `,
    percentage: `
      <div class="prop-control">
        <label>Rounding:</label>
        <select class="tool-select">
          <option>2 decimal places</option>
          <option>No rounding</option>
        </select>
      </div>
    `,
    wordcounter: `
      <div class="prop-control">
        <label>Count:</label>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="countChars" checked>
          <label class="form-check-label">Characters</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="countWords" checked>
          <label class="form-check-label">Words</label>
        </div>
      </div>
    `,
    unitconverter: `
      <div class="prop-control">
        <label>Precision:</label>
        <select class="tool-select">
          <option>4 decimal places</option>
          <option>2 decimal places</option>
        </select>
      </div>
    `,
    scientific: `
      <div class="prop-control">
        <label>Angle Mode:</label>
        <select class="tool-select">
          <option>Degrees</option>
          <option>Radians</option>
        </select>
      </div>
    `,
    pdfmerger: `
      <div class="prop-control">
        <label>Merge Options:</label>
        <select class="tool-select">
          <option>Combine all</option>
          <option>Append sequentially</option>
        </select>
      </div>
    `,
    pdfsplitter: `
      <div class="prop-control">
        <label>Split Mode:</label>
        <select class="tool-select">
          <option>Page range</option>
          <option>Every N pages</option>
        </select>
      </div>
    `,
    textformatter: `
      <div class="prop-control">
        <label>Auto-trim:</label>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" checked>
          <label class="form-check-label">Remove extra spaces</label>
        </div>
      </div>
    `,
    passwordgen: `
      <div class="prop-control">
        <label>Include:</label>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" checked>
          <label class="form-check-label">Uppercase</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" checked>
          <label class="form-check-label">Lowercase</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" checked>
          <label class="form-check-label">Numbers</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" checked>
          <label class="form-check-label">Symbols</label>
        </div>
      </div>
    `,
    studytimer: `
      <div class="prop-control">
        <label>Auto-restart:</label>
        <div class="form-check">
          <input class="form-check-input" type="checkbox">
          <label class="form-check-label">Restart after finish</label>
        </div>
      </div>
    `
  };

  function setActiveTool(btn, tool) {
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTool = tool;
    
    // Render tool content
    toolContent.innerHTML = toolContentTemplates[tool] || '<div class="text-center text-muted py-5">Tool content not available</div>';
    
    // Render properties
    toolProperties.innerHTML = toolPropertiesTemplates[tool] || '<div class="text-center text-muted py-4">No settings available</div>';
    
    // Reset status
    statusInfo.innerHTML = '<span>Ready</span>';
    processedResults = [];
  }

  // ==================== TOOL OPERATIONS ====================
  
  // CGPA
  function calculateCGPA() {
    let prev = parseFloat(document.getElementById('prevCgpa').value) || 0;
    let prevCred = parseFloat(document.getElementById('prevCredits').value) || 0;
    let newG = parseFloat(document.getElementById('newGpa').value) || 0;
    let newCred = parseFloat(document.getElementById('newCredits').value) || 0;
    if (prevCred + newCred === 0) { document.getElementById('cgpaResult').innerHTML = '⚠️ Enter credits'; return; }
    let totalPoints = (prev * prevCred) + (newG * newCred);
    let cgpa = totalPoints / (prevCred + newCred);
    document.getElementById('cgpaResult').innerHTML = '🎯 CGPA: ' + cgpa.toFixed(2);
    processedResults = [{ name: 'cgpa_result.txt', data: `CGPA: ${cgpa.toFixed(2)}` }];
  }

  // Percentage
  function calcPercent() {
    let val = parseFloat(document.getElementById('percValue').value) || 0;
    let perc = parseFloat(document.getElementById('percOf').value) || 0;
    let result = (val * perc / 100);
    document.getElementById('percResult').innerHTML = '📊 Result: ' + result.toFixed(2);
    processedResults = [{ name: 'percentage_result.txt', data: `Percentage: ${result.toFixed(2)}` }];
  }

  // Word Counter
  function countWords() {
    let txt = document.getElementById('wordText').value;
    let words = txt.match(/\b\w+\b/g)?.length || 0;
    let chars = txt.length;
    document.getElementById('wordResult').innerHTML = `📝 words: ${words} | chars: ${chars}`;
    processedResults = [{ name: 'word_count.txt', data: `Words: ${words}\nCharacters: ${chars}` }];
  }

  // Unit Converter
  function convertUnit() {
    let val = parseFloat(document.getElementById('unitInput').value) || 0;
    let from = document.getElementById('fromUnit').value;
    let to = document.getElementById('toUnit').value;
    let inMeters = (from === 'm') ? val : (from === 'km') ? val*1000 : (from === 'cm') ? val/100 : val/1000;
    let result = (to === 'm') ? inMeters : (to === 'km') ? inMeters/1000 : (to === 'cm') ? inMeters*100 : inMeters*1000;
    document.getElementById('unitResult').innerHTML = `📏 ${result.toFixed(4)} ${to}`;
    processedResults = [{ name: 'unit_conversion.txt', data: `${val} ${from} = ${result.toFixed(4)} ${to}` }];
  }

  // Scientific
  function sciOp(op) {
    let num = parseFloat(document.getElementById('sciNum').value) || 0;
    let res;
    if (op === 'sqrt') res = Math.sqrt(num);
    else if (op === 'sin') res = Math.sin(num * Math.PI/180);
    else if (op === 'cos') res = Math.cos(num * Math.PI/180);
    else if (op === 'log') res = Math.log10(num);
    else if (op === 'square') res = num*num;
    document.getElementById('sciResult').innerHTML = `🔢 = ${res.toFixed(6)}`;
    processedResults = [{ name: 'scientific_result.txt', data: `${op}(${num}) = ${res.toFixed(6)}` }];
  }

  // Text Formatter
  function formatText(action) {
    let raw = document.getElementById('rawText').value;
    if (action === 'upper') raw = raw.toUpperCase();
    else if (action === 'lower') raw = raw.toLowerCase();
    else if (action === 'trim') raw = raw.replace(/\s+/g, ' ').trim();
    document.getElementById('formattedResult').innerHTML = raw || '(empty)';
    processedResults = [{ name: 'formatted_text.txt', data: raw }];
  }

  // Password Generator
  function generatePassword() {
    let len = parseInt(document.getElementById('passLen').value) || 12;
    let chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()';
    let pass = '';
    for (let i=0; i<len; i++) pass += chars[Math.floor(Math.random()*chars.length)];
    document.getElementById('passResult').innerHTML = `🔐 ${pass}`;
    processedResults = [{ name: 'password.txt', data: pass }];
  }

  // PDF Merger
  async function mergePDFs() {
    const files = document.getElementById('mergeFiles').files;
    if (files.length < 2) { document.getElementById('mergeStatus').innerHTML = '⚠️ Select at least 2 PDFs.'; return; }
    document.getElementById('mergeStatus').innerHTML = '⏳ Merging...';
    const { PDFDocument } = PDFLib;
    const mergedPdf = await PDFDocument.create();
    for (let file of files) {
      const arrayBuf = await file.arrayBuffer();
      const pdf = await PDFDocument.load(arrayBuf);
      const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
      pages.forEach(page => mergedPdf.addPage(page));
    }
    const mergedPdfBytes = await mergedPdf.save();
    const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
    saveAs(blob, 'merged.pdf');
    document.getElementById('mergeStatus').innerHTML = '✅ Merged PDF downloaded!';
    processedResults = [];
  }

  // PDF Splitter
  async function splitPDF() {
    const file = document.getElementById('splitFile').files[0];
    if (!file) { document.getElementById('splitStatus').innerHTML = '⚠️ Select a PDF file.'; return; }
    const rangeStr = document.getElementById('pageRange').value.trim();
    if (!rangeStr) { document.getElementById('splitStatus').innerHTML = '⚠️ Enter range like 2-5.'; return; }
    const match = rangeStr.match(/^(\d+)-(\d+)$/);
    if (!match) { document.getElementById('splitStatus').innerHTML = '⚠️ Invalid range. Use e.g. 2-5'; return; }
    let start = parseInt(match[1]) - 1;
    let end = parseInt(match[2]) - 1;
    if (start < 0 || end < start) { document.getElementById('splitStatus').innerHTML = '⚠️ Invalid range.'; return; }
    document.getElementById('splitStatus').innerHTML = '⏳ Splitting...';
    const { PDFDocument } = PDFLib;
    const arrayBuf = await file.arrayBuffer();
    const sourceDoc = await PDFDocument.load(arrayBuf);
    const totalPages = sourceDoc.getPageCount();
    if (start >= totalPages || end >= totalPages) { document.getElementById('splitStatus').innerHTML = '⚠️ Range exceeds page count.'; return; }
    const newDoc = await PDFDocument.create();
    const pages = await newDoc.copyPages(sourceDoc, Array.from({ length: end-start+1 }, (_, i) => start + i));
    pages.forEach(page => newDoc.addPage(page));
    const pdfBytes = await newDoc.save();
    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
    saveAs(blob, `split_pages_${match[1]}_to_${match[2]}.pdf`);
    document.getElementById('splitStatus').innerHTML = '✅ Split PDF downloaded!';
    processedResults = [];
  }

  // Study Timer
  let timerInterval2, timerSeconds = 25*60, timerRunning = false;
  function updateTimerDisplay() {
    let mins = Math.floor(timerSeconds/60);
    let secs = timerSeconds%60;
    document.getElementById('timerDisplay').innerHTML = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
  }
  function startTimer() {
    let mins = parseInt(document.getElementById('timerMinutes').value) || 25;
    if (!timerRunning) {
      timerSeconds = mins * 60;
      updateTimerDisplay();
      timerRunning = true;
      timerInterval2 = setInterval(() => {
        if (timerSeconds > 0) {
          timerSeconds--;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval2);
          timerRunning = false;
          alert('⏰ Timer finished!');
        }
      }, 1000);
    }
  }
  function pauseTimer() {
    if (timerRunning) {
      clearInterval(timerInterval2);
      timerRunning = false;
    }
  }
  function resetTimer() {
    clearInterval(timerInterval2);
    timerRunning = false;
    let mins = parseInt(document.getElementById('timerMinutes').value) || 25;
    timerSeconds = mins * 60;
    updateTimerDisplay();
  }

  // ==================== MAIN APPLY TOOL ====================
  function applyTool() {
    switch(currentTool) {
      case 'cgpa': calculateCGPA(); break;
      case 'percentage': calcPercent(); break;
      case 'wordcounter': countWords(); break;
      case 'unitconverter': convertUnit(); break;
      case 'scientific': break; // handled by buttons
      case 'pdfmerger': mergePDFs(); break;
      case 'pdfsplitter': splitPDF(); break;
      case 'textformatter': break; // handled by buttons
      case 'passwordgen': generatePassword(); break;
      case 'studytimer': startTimer(); break;
      default: showToast('Tool not ready', true);
    }
    statusInfo.innerHTML = `<span>✅ Done</span>`;
  }

  // ==================== DOWNLOAD RESULTS ====================
  function downloadResults() {
    if (processedResults.length === 0) {
      showToast('No results to download', true);
      return;
    }
    processedResults.forEach((res, index) => {
      const blob = new Blob([res.data], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = res.name;
      setTimeout(() => { a.click(); URL.revokeObjectURL(url); }, index * 200);
    });
    showToast(`Downloading ${processedResults.length} file(s)`);
  }

  // ==================== RESET ====================
  function resetAll() {
    processedResults = [];
    statusInfo.innerHTML = '<span>Ready</span>';
    // Re-render current tool to reset UI
    const activeBtn = document.querySelector('.tool-btn.active');
    if (activeBtn) {
      const tool = activeBtn.getAttribute('onclick').match(/'([^']+)'/)[1];
      setActiveTool(activeBtn, tool);
    }
    showToast('Reset complete');
  }

  // ==================== INIT ====================
  document.addEventListener('DOMContentLoaded', function() {
    // Set initial tool
    const firstBtn = document.querySelector('.tool-btn.active');
    if (firstBtn) {
      const tool = firstBtn.getAttribute('onclick').match(/'([^']+)'/)[1];
      setActiveTool(firstBtn, tool);
    }
    
    // Timer display init
    updateTimerDisplay();
  });
</script>
</body>
