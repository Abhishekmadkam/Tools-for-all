<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Tools · Ultimate Academic Suite (30+ Tools)</title>
  <!-- Bootstrap + icons + font -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
  <!-- PDF libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <style>
    * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(145deg, #f0f4fb, #fafcff);
      min-height: 100vh;
      padding: 20px 0;
      transition: background 0.3s, color 0.3s;
    }
    body.dark-mode {
      background: linear-gradient(145deg, #0f1a2f, #1a2a4a);
      color: #e2ecff;
    }
    .app-wrapper {
      max-width: 1600px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .google-ad-space {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 20px;
      margin: 20px 0;
      text-align: center;
      border: 2px dashed #2c3e7a;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
    }
    body.dark-mode .google-ad-space {
      background: rgba(26,42,74,0.85);
      border-color: #4a5f8a;
      color: #ffd700;
    }
    .google-ad-space:hover { background: #f0f5ff; }
    body.dark-mode .google-ad-space:hover { background: #1e2a40; }
    .google-ad-placeholder {
      color: #2c3e7a;
      font-weight: 600;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    body.dark-mode .google-ad-placeholder { color: #ffd700; }

    .app-header {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 16px 30px;
      margin-bottom: 30px;
      box-shadow: 0 15px 35px -10px rgba(0,20,60,0.12);
      border: 1px solid rgba(255,255,255,0.5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
      transition: 0.3s;
    }
    body.dark-mode .app-header {
      background: rgba(26,42,74,0.92);
      border-color: #33415e;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      background: linear-gradient(135deg, #2c3e7a, #1a2a5c);
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      transition: 0.3s;
    }
    .logo-icon:hover { transform: rotate(-6deg) scale(1.1); }
    .logo-text h1 {
      font-weight: 700;
      font-size: 1.8rem;
      margin: 0;
      background: linear-gradient(135deg, #2c3e7a, #1a2a5c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    body.dark-mode .logo-text h1 {
      background: linear-gradient(135deg, #8a9fd1, #6a8fc8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo-text p { margin: 0; font-size: 0.85rem; color: #666; }
    body.dark-mode .logo-text p { color: #aab8e0; }

    .editor-layout {
      display: grid;
      grid-template-columns: 280px 1fr 320px;
      gap: 20px;
      margin-bottom: 30px;
    }

    .tools-panel, .canvas-panel, .properties-panel {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 15px 35px -10px rgba(0,20,60,0.12);
      transition: 0.3s;
    }
    body.dark-mode .tools-panel,
    body.dark-mode .canvas-panel,
    body.dark-mode .properties-panel {
      background: rgba(26,42,74,0.92);
      border-color: #33415e;
    }

    .tools-header {
      font-weight: 700;
      font-size: 1.2rem;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid rgba(44,62,122,0.08);
      display: flex;
      align-items: center;
      gap: 10px;
      color: #2c3e7a;
    }
    body.dark-mode .tools-header {
      color: #8a9fd1;
      border-bottom-color: rgba(138,159,209,0.15);
    }

    .tools-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 600px;
      overflow-y: auto;
    }
    .tools-grid::-webkit-scrollbar { width: 4px; }
    .tools-grid::-webkit-scrollbar-thumb { background: #2c3e7a; border-radius: 10px; }
    body.dark-mode .tools-grid::-webkit-scrollbar-thumb { background: #6a8fc8; }

    .tool-btn {
      background: transparent;
      border: none;
      padding: 10px 14px;
      border-radius: 16px;
      text-align: left;
      font-weight: 500;
      font-size: 0.9rem;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #333;
      width: 100%;
    }
    body.dark-mode .tool-btn { color: #e2ecff; }
    .tool-btn i { font-size: 1.2rem; width: 26px; color: #2c3e7a; }
    body.dark-mode .tool-btn i { color: #8a9fd1; }
    .tool-btn:hover {
      background: rgba(44,62,122,0.08);
      transform: translateX(4px);
    }
    body.dark-mode .tool-btn:hover { background: rgba(138,159,209,0.1); }
    .tool-btn.active {
      background: linear-gradient(135deg, #2c3e7a, #1a2a5c);
      color: white;
    }
    body.dark-mode .tool-btn.active { background: linear-gradient(135deg, #4a5f8a, #2a3f6a); }
    .tool-btn.active i { color: white; }

    .canvas-panel { min-height: 500px; }
    .result-display {
      background: #f8faff;
      border-radius: 20px;
      padding: 15px;
      margin-top: 15px;
      border: 1px solid #e0e8f0;
      word-break: break-all;
    }
    body.dark-mode .result-display {
      background: #1a2a44;
      border-color: #33415e;
      color: #e2ecff;
    }

    .prop-section { margin-bottom: 25px; }
    .prop-title {
      font-weight: 600;
      margin-bottom: 15px;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #2c3e7a;
    }
    body.dark-mode .prop-title { color: #8a9fd1; }
    .prop-control { margin-bottom: 15px; }
    .prop-control label {
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 5px;
      display: block;
    }
    body.dark-mode .prop-control label { color: #aab8e0; }

    .form-control, .form-select {
      border-radius: 30px;
      padding: 10px 15px;
      border: 1.5px solid #d0ddee;
      background: white;
      font-weight: 500;
      transition: 0.3s;
    }
    body.dark-mode .form-control,
    body.dark-mode .form-select {
      background: #1a2a44;
      border-color: #33415e;
      color: #e2ecff;
    }
    .form-control:focus, .form-select:focus {
      border-color: #2c3e7a;
      box-shadow: 0 0 0 3px rgba(44,62,122,0.12);
      outline: none;
    }
    body.dark-mode .form-control:focus,
    body.dark-mode .form-select:focus {
      border-color: #6a8fc8;
      box-shadow: 0 0 0 3px rgba(106,143,200,0.15);
    }

    .btn-primary-custom {
      background: linear-gradient(135deg, #2c3e7a, #1a2a5c);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 12px;
      font-weight: 600;
      transition: 0.2s;
      width: 100%;
    }
    .btn-primary-custom:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 20px rgba(44,62,122,0.3);
    }
    body.dark-mode .btn-primary-custom { background: linear-gradient(135deg, #4a5f8a, #2a3f6a); }

    .btn-outline-custom {
      background: transparent;
      border: 1.5px solid #2c3e7a;
      color: #2c3e7a;
      border-radius: 20px;
      padding: 8px 16px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: 0.2s;
    }
    body.dark-mode .btn-outline-custom {
      border-color: #6a8fc8;
      color: #8a9fd1;
    }
    .btn-outline-custom:hover {
      background: #2c3e7a;
      color: white;
    }
    body.dark-mode .btn-outline-custom:hover {
      background: #4a5f8a;
      color: white;
    }

    .bottom-toolbar {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 15px 25px;
      margin-top: 20px;
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 15px 35px -10px rgba(0,20,60,0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
      transition: 0.3s;
    }
    body.dark-mode .bottom-toolbar {
      background: rgba(26,42,74,0.92);
      border-color: #33415e;
    }
    .status-info {
      display: flex;
      gap: 20px;
      font-size: 0.9rem;
      color: #666;
    }
    body.dark-mode .status-info { color: #aab8e0; }
    .status-info span {
      font-weight: 600;
      color: #2c3e7a;
    }
    body.dark-mode .status-info span { color: #8a9fd1; }

    .download-btn {
      background: #28a745;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 12px 30px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.2s;
    }
    .download-btn:hover {
      background: #34ce57;
      transform: scale(1.04);
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast-msg {
      position: fixed;
      top: 20px;
      right: 20px;
      background: white;
      border-left: 8px solid #2c3e7a;
      padding: 16px 30px;
      border-radius: 60px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
      z-index: 99999;
      font-weight: 500;
      animation: slideIn 0.3s ease;
    }
    body.dark-mode .toast-msg {
      background: #1a2a44;
      color: #e2ecff;
      border-left-color: #6a8fc8;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    #timerDisplay {
      font-size: 3.8rem;
      font-weight: 700;
      color: #2c3e7a;
      letter-spacing: 2px;
      background: #eaf2fa;
      border-radius: 80px;
      padding: 0.4rem 1rem;
      display: inline-block;
      min-width: 200px;
    }
    body.dark-mode #timerDisplay {
      color: #8a9fd1;
      background: #1a2a44;
    }

    @media (max-width: 1200px) {
      .editor-layout { grid-template-columns: 1fr; }
      .tools-grid {
        display: grid !important;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        max-height: none;
      }
    }
    @media (max-width: 576px) {
      .app-header { padding: 12px 18px; }
      .logo-text h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
<div class="app-wrapper">

  <div class="google-ad-space">
    <div class="google-ad-placeholder">
      <i class="bi bi-google" style="font-size:1.8rem;"></i>
      <span>Google AdSense Space (Top)</span>
    </div>
  </div>

  <div class="app-header">
    <div class="logo">
      <div class="logo-icon"><i class="bi bi-mortarboard-fill"></i></div>
      <div class="logo-text">
        <h1>Student Tools</h1>
        <p>Ultimate Academic Suite · 30+ Tools</p>
      </div>
    </div>
    <div class="d-flex gap-3">
      <button class="btn btn-outline-secondary rounded-pill" onclick="toggleDarkMode()" id="darkBtn">
        <i class="bi bi-moon"></i> Dark
      </button>
      <button class="btn btn-outline-primary rounded-pill" onclick="resetAll()">
        <i class="bi bi-arrow-counterclockwise"></i> Reset
      </button>
    </div>
  </div>

  <div class="editor-layout">
    <div class="tools-panel">
      <div class="tools-header">
        <i class="bi bi-tools"></i>
        <span>30+ Tools</span>
      </div>
      <div class="tools-grid" id="toolsGrid">
        <!-- All tools will be rendered by JS -->
      </div>
      <div class="mt-4">
        <button class="btn-primary-custom" onclick="applyTool()" id="applyBtn">
          <i class="bi bi-play-fill"></i> Run Tool
        </button>
      </div>
    </div>

    <div class="canvas-panel">
      <div id="toolContent">
        <div class="text-center text-muted py-5">Select a tool from the left panel</div>
      </div>
    </div>

    <div class="properties-panel">
      <div class="prop-section">
        <div class="prop-title">
          <i class="bi bi-sliders2"></i>
          <span>Settings</span>
        </div>
        <div id="toolProperties">
          <div class="text-center text-muted py-4">Select a tool to configure</div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-toolbar">
    <div class="status-info" id="statusInfo">
      <span>Ready</span>
    </div>
    <button class="download-btn" onclick="downloadResults()">
      <i class="bi bi-download"></i>
      <span>Download Results</span>
    </button>
  </div>

  <div class="google-ad-space mt-4">
    <div class="google-ad-placeholder">
      <i class="bi bi-google" style="font-size:1.8rem;"></i>
      <span>Google AdSense Space (Bottom)</span>
    </div>
  </div>

  <footer class="text-center small text-muted mt-4">
    Student Tools · Ultimate Academic Suite with 30+ fully working tools
  </footer>
</div>

<script>
  // ==================== TOOL DEFINITIONS (30+ tools) ====================
  const TOOLS = [
    { id: 'cgpa', icon: 'bi-calculator-fill', label: 'CGPA Calculator' },
    { id: 'percentage', icon: 'bi-percent', label: 'Percentage' },
    { id: 'wordcounter', icon: 'bi-chart-bar', label: 'Word Counter' },
    { id: 'unitconverter', icon: 'bi-arrow-left-right', label: 'Unit Converter' },
    { id: 'scientific', icon: 'bi-symmetry-vertical', label: 'Scientific Calc' },
    { id: 'pdfmerger', icon: 'bi-file-earmark-pdf-fill', label: 'PDF Merger' },
    { id: 'pdfsplitter', icon: 'bi-scissors', label: 'PDF Splitter' },
    { id: 'textformatter', icon: 'bi-textarea-t', label: 'Text Formatter' },
    { id: 'passwordgen', icon: 'bi-shield-lock-fill', label: 'Password Gen' },
    { id: 'studytimer', icon: 'bi-clock-history', label: 'Study Timer' },
    { id: 'bmi', icon: 'bi-heart-pulse', label: 'BMI Calculator' },
    { id: 'loan', icon: 'bi-coin', label: 'Loan Calculator' },
    { id: 'gradecalculator', icon: 'bi-award', label: 'Grade Calculator' },
    { id: 'gpaestimator', icon: 'bi-graph-up', label: 'GPA Estimator' },
    { id: 'discount', icon: 'bi-tag', label: 'Discount Calculator' },
    { id: 'tip', icon: 'bi-cash', label: 'Tip Calculator' },
    { id: 'currency', icon: 'bi-currency-exchange', label: 'Currency Converter' },
    { id: 'age', icon: 'bi-calendar3', label: 'Age Calculator' },
    { id: 'timezone', icon: 'bi-clock', label: 'Time Zone Converter' },
    { id: 'speed', icon: 'bi-speedometer2', label: 'Speed Converter' },
    { id: 'area', icon: 'bi-grid', label: 'Area Converter' },
    { id: 'volume', icon: 'bi-cup-straw', label: 'Volume Converter' },
    { id: 'weight', icon: 'bi-weight-scale', label: 'Weight Converter' },
    { id: 'temperature', icon: 'bi-thermometer-half', label: 'Temperature Converter' },
    { id: 'length', icon: 'bi-rulers', label: 'Length Converter' },
    { id: 'randomnumber', icon: 'bi-dice-5', label: 'Random Number' },
    { id: 'randomcolor', icon: 'bi-palette', label: 'Random Color' },
    { id: 'uuidgen', icon: 'bi-hash', label: 'UUID Generator' },
    { id: 'hashgen', icon: 'bi-fingerprint', label: 'Hash Generator' },
    { id: 'basesixtyfour', icon: 'bi-code-square', label: 'Base64 Encoder' },
    { id: 'urlencoder', icon: 'bi-link-45deg', label: 'URL Encoder' },
    { id: 'jsonformatter', icon: 'bi-braces', label: 'JSON Formatter' },
    { id: 'loremipsum', icon: 'bi-text-paragraph', label: 'Lorem Ipsum' }
  ];

  // ==================== CONTENT TEMPLATES ====================
  const TOOL_TEMPLATES = {
    cgpa: `
      <h4 class="mb-3"><i class="bi bi-calculator-fill me-2"></i>CGPA Calculator</h4>
      <div class="mb-3"><input type="number" class="form-control" id="prevCgpa" placeholder="Previous CGPA" step="0.01"></div>
      <div class="mb-3"><input type="number" class="form-control" id="prevCredits" placeholder="Total credits" step="1"></div>
      <div class="mb-3"><input type="number" class="form-control" id="newGpa" placeholder="New semester GPA" step="0.01"></div>
      <div class="mb-3"><input type="number" class="form-control" id="newCredits" placeholder="New credits" step="1"></div>
      <div id="cgpaResult" class="result-display text-center fw-bold">—</div>
    `,
    percentage: `
      <h4 class="mb-3"><i class="bi bi-percent me-2"></i>Percentage Calculator</h4>
      <div class="row g-3">
        <div class="col-md-6"><input type="number" class="form-control" id="percValue" placeholder="Value"></div>
        <div class="col-md-6"><input type="number" class="form-control" id="percOf" placeholder="Percentage %"></div>
      </div>
      <div class="mt-3 row g-3">
        <div class="col-md-6"><input type="number" class="form-control" id="discountPerc" placeholder="Discount %"></div>
        <div class="col-md-6"><input type="number" class="form-control" id="taxPerc" placeholder="Tax %"></div>
      </div>
      <div id="percResult" class="result-display text-center fw-bold mt-3">—</div>
    `,
    wordcounter: `
      <h4 class="mb-3"><i class="bi bi-chart-bar me-2"></i>Word Counter</h4>
      <div class="mb-3"><textarea class="form-control" id="wordText" rows="6" placeholder="Type or paste text..."></textarea></div>
      <div id="wordResult" class="result-display text-center fw-bold">words: 0 | chars: 0 | sentences: 0</div>
    `,
    unitconverter: `
      <h4 class="mb-3"><i class="bi bi-arrow-left-right me-2"></i>Unit Converter</h4>
      <div class="mb-3"><input type="number" class="form-control" id="unitInput" placeholder="Enter value"></div>
      <div class="row g-2">
        <div class="col-md-6">
          <select class="form-select" id="fromUnit">
            <option value="m">meters</option><option value="km">km</option>
            <option value="cm">cm</option><option value="mm">mm</option>
            <option value="ft">feet</option><option value="in">inches</option>
            <option value="kg">kg</option><option value="lb">pounds</option>
            <option value="c">Celsius</option><option value="f">Fahrenheit</option>
          </select>
        </div>
        <div class="col-md-6">
          <select class="form-select" id="toUnit">
            <option value="m">meters</option><option value="km">km</option>
            <option value="cm">cm</option><option value="mm">mm</option>
            <option value="ft">feet</option><option value="in">inches</option>
            <option value="kg">kg</option><option value="lb">pounds</option>
            <option value="c">Celsius</option><option value="f">Fahrenheit</option>
          </select>
        </div>
      </div>
      <div id="unitResult" class="result-display text-center fw-bold mt-3">—</div>
    `,
    scientific: `
      <h4 class="mb-3"><i class="bi bi-symmetry-vertical me-2"></i>Scientific Calculator</h4>
      <div class="mb-3"><input type="number" class="form-control" id="sciNum" placeholder="Enter number"></div>
      <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-outline-custom" onclick="sciOp('sqrt')">√</button>
        <button class="btn btn-outline-custom" onclick="sciOp('sin')">sin</button>
        <button class="btn btn-outline-custom" onclick="sciOp('cos')">cos</button>
        <button class="btn btn-outline-custom" onclick="sciOp('tan')">tan</button>
        <button class="btn btn-outline-custom" onclick="sciOp('log')">log₁₀</button>
        <button class="btn btn-outline-custom" onclick="sciOp('ln')">ln</button>
        <button class="btn btn-outline-custom" onclick="sciOp('square')">x²</button>
        <button class="btn btn-outline-custom" onclick="sciOp('cube')">x³</button>
        <button class="btn btn-outline-custom" onclick="sciOp('factorial')">x!</button>
      </div>
      <div id="sciResult" class="result-display text-center fw-bold mt-3">—</div>
    `,
    pdfmerger: `
      <h4 class="mb-3"><i class="bi bi-file-earmark-pdf-fill me-2"></i>PDF Merger</h4>
      <p class="text-muted">Select up to 5 PDF files to merge</p>
      <div class="mb-3"><input type="file" class="form-control" id="mergeFiles" accept=".pdf" multiple></div>
      <div id="mergeStatus" class="result-display text-center">waiting for files...</div>
    `,
    pdfsplitter: `
      <h4 class="mb-3"><i class="bi bi-scissors me-2"></i>PDF Splitter</h4>

  function calculateCGPA() {
    let prev = parseFloat(document.getElementById('prevCgpa')?.value) || 0;
    let prevCred = parseFloat(document.getElementById('prevCredits')?.value) || 0;
    let newG = parseFloat(document.getElementById('newGpa')?.value) || 0;
    let newCred = parseFloat(document.getElementById('newCredits')?.value) || 0;
    if (prevCred + newCred === 0) { document.getElementById('cgpaResult').innerHTML = '⚠️ Enter credits'; return; }
    let cgpa = ((prev * prevCred) + (newG * newCred)) / (prevCred + newCred);
    document.getElementById('cgpaResult').innerHTML = `🎯 CGPA: ${cgpa.toFixed(2)}`;
    processedResults = [{ name: 'cgpa.txt', data: `CGPA: ${cgpa.toFixed(2)}` }];
  }

  function calcPercent() {
    let val = parseFloat(document.getElementById('percValue')?.value) || 0;
    let perc = parseFloat(document.getElementById('percOf')?.value) || 0;
    let discount = parseFloat(document.getElementById('discountPerc')?.value) || 0;
    let tax = parseFloat(document.getElementById('taxPerc')?.value) || 0;
    let result = val * perc / 100;
    let discounted = result - (result * discount / 100);
    let withTax = discounted + (discounted * tax / 100);
    document.getElementById('percResult').innerHTML = `📊 ${perc}% of ${val} = ${result.toFixed(2)}<br>${discount > 0 ? `After ${discount}% discount: ${discounted.toFixed(2)}<br>` : ''}${tax > 0 ? `After ${tax}% tax: ${withTax.toFixed(2)}` : ''}`;

  function convertUnit() {
    let val = parseFloat(document.getElementById('unitInput')?.value) || 0;
    let from = document.getElementById('fromUnit')?.value || 'm';
    let to = document.getElementById('toUnit')?.value || 'km';
    let result = 0;
    // Length
    if (['m','km','cm','mm','ft','in'].includes(from) && ['m','km','cm','mm','ft','in'].includes(to)) {
      let inMeters = from === 'm' ? val : from === 'km' ? val*1000 : from === 'cm' ? val/100 : from === 'mm' ? val/1000 : from === 'ft' ? val*0.3048 : val*0.0254;
      result = to === 'm' ? inMeters : to === 'km' ? inMeters/1000 : to === 'cm' ? inMeters*100 : to === 'mm' ? inMeters*1000 : to === 'ft' ? inMeters/0.3048 : inMeters/0.0254;
    }
    // Weight
    else if (['kg','lb'].includes(from) && ['kg','lb'].includes(to)) {
      let inKg = from === 'kg' ? val : val*0.453592;
      result = to === 'kg' ? inKg : inKg/0.453592;
    }
    // Temperature
    else if (['c','f'].includes(from) && ['c','f'].includes(to)) {
      result = from === 'c' ? (val * 9/5) + 32 : (val - 32) * 5/9;
    }
    document.getElementById('unitResult').innerHTML = `📏 ${val} ${from} = ${result.toFixed(4)} ${to}`;
    processedResults = [{ name: 'unitconv.txt', data: `${val} ${from} = ${result.toFixed(4)} ${to}` }];
  }

  function sciOp(op) {
    let num = parseFloat(document.getElementById('sciNum')?.value) || 0;
    let mode = document.getElementById('angleMode')?.value || 'deg';
    let res;
    if (op === 'sqrt') res = Math.sqrt(num);
    else if (op === 'sin') res = Math.sin(mode === 'deg' ? num * Math.PI/180 : num);
    else if (op === 'cos') res = Math.cos(mode === 'deg' ? num * Math.PI/180 : num);
    else if (op === 'tan') res = Math.tan(mode === 'deg' ? num * Math.PI/180 : num);
    else if (op === 'log') res = Math.log10(num);
    else if (op === 'ln') res = Math.log(num);
    else if (op === 'square') res = num*num;
    else if (op === 'cube') res = num*num*num;
    else if (op === 'factorial') { res = 1; for (let i=2; i<=num; i++) res *= i; }
    document.getElementById('sciResult').innerHTML = `🔢 ${op}(${num}) = ${res.toFixed(6)}`;
    processedResults = [{ name: 'scientific.txt', data: `${op}(${num}) = ${res.toFixed(6)}` }];
  }

  // PDF Merger
  async function mergePDFs() {
    const files = document.getElementById('mergeFiles')?.files || [];
    if (files.length < 2) { document.getElementById('mergeStatus').innerHTML = '⚠️ Select at least 2 PDFs.'; return; }
    document.getElementById('mergeStatus').innerHTML = '⏳ Merging...';
    const { PDFDocument } = PDFLib;
    const mergedPdf = await PDFDocument.create();
    for (let file of files) {
      const arrayBuf = await file.arrayBuffer();
      const pdf = await PDFDocument.load(arrayBuf);
      const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
      pages.forEach(page => mergedPdf.addPage(page));
    }
    const bytes = await mergedPdf.save();
    const blob = new Blob([bytes], { type: 'application/pdf' });
    saveAs(blob, 'merged.pdf');
    document.getElementById('mergeStatus').innerHTML = '✅ Downloaded!';
    processedResults = [];
  }

  // PDF Splitter
  async function splitPDF() {
    const file = document.getElementById('splitFile')?.files[0];
    if (!file) { document.getElementById('splitStatus').innerHTML = '⚠️ Select a PDF.'; return; }
    const rangeStr = document.getElementById('pageRange')?.value || '';
    if (!rangeStr) { document.getElementById('splitStatus').innerHTML = '⚠️ Enter range.'; return; }
    document.getElementById('splitStatus').innerHTML = '⏳ Splitting...';
    const { PDFDocument } = PDFLib;
    const arrayBuf = await file.arrayBuffer();
    const sourceDoc = await PDFDocument.load(arrayBuf);
    const totalPages = sourceDoc.getPageCount();
    const newDoc = await PDFDocument.create();
    const pagesToCopy = [];
    const parts = rangeStr.split(',').map(p => p.trim());
    for (let part of parts) {
      if (part.includes('-')) {
        const [start, end] = part.split('-').map(Number);
        for (let i = start; i <= end && i <= totalPages; i++) pagesToCopy.push(i - 1);
      } else {
        const p = parseInt(part);
        if (p <= totalPages) pagesToCopy.push(p - 1);
      }
    }
    if (pagesToCopy.length === 0) { document.getElementById('splitStatus').innerHTML = '⚠️ No valid pages.'; return; }
    const pages = await newDoc.copyPages(sourceDoc, pagesToCopy);
    pages.forEach(page => newDoc.addPage(page));
    const bytes = await newDoc.save();
    const blob = new Blob([bytes], { type: 'application/pdf' });
    saveAs(blob, 'split.pdf');
    document.getElementById('splitStatus').innerHTML = '✅ Downloaded!';
    processedResults = [];
  }

  function formatText(action) {
    let raw = document.getElementById('rawText')?.value || '';
    if (action === 'upper') raw = raw.toUpperCase();
    else if (action === 'lower') raw = raw.toLowerCase();
    else if (action === 'title') raw = raw.replace(/\w\S*/g, w => w[0].toUpperCase() + w.slice(1).toLowerCase());
    else if (action === 'trim') raw = raw.replace(/\s+/g, ' ').trim();
    else if (action === 'reverse') raw = raw.split('').reverse().join('');
    document.getElementById('formattedResult').innerHTML = raw || '(empty)';
    processedResults = [{ name: 'formatted.txt', data: raw }];
  }

  function generatePassword() {

    let chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()';

  function calculateBMI() {
    let w = parseFloat(document.getElementById('bmiWeight')?.value) || 0;
    let h = parseFloat(document.getElementById('bmiHeight')?.value) || 0;
    if (w <= 0 || h <= 0) { document.getElementById('bmiResult').innerHTML = '⚠️ Enter valid values'; return; }
    let bmi = w / ((h/100) * (h/100));
    let cat = bmi < 18.5 ? 'Underweight' : bmi < 25 ? 'Normal' : bmi < 30 ? 'Overweight' : 'Obese';
    document.getElementById('bmiResult').innerHTML = `📊 BMI: ${bmi.toFixed(1)} (${cat})`;
    processedResults = [{ name: 'bmi.txt', data: `BMI: ${bmi.toFixed(1)} (${cat})` }];

  function calculateLoan() {
    let amt = parseFloat(document.getElementById('loanAmount')?.value) || 0;
    let rate = parseFloat(document.getElementById('loanRate')?.value) || 0;
    let term = parseInt(document.getElementById('loanTerm')?.value) || 1;
    if (amt <= 0 || term <= 0) { document.getElementById('loanResult').innerHTML = '⚠️ Enter valid values'; return; }
    let mr = (rate/100)/12;
    let payment = amt * mr * Math.pow(1+mr, term) / (Math.pow(1+mr, term) - 1);
    let total = payment * term;
    document.getElementById('loanResult').innerHTML = `💰 Monthly: $${payment.toFixed(2)}<br>Total: $${total.toFixed(2)}<br>Interest: $${(total-amt).toFixed(2)}`;
    processedResults = [{ name: 'loan.txt', data: `Monthly: $${payment.toFixed(2)}\nTotal: $${total.toFixed(2)}` }];
  }

    let total = parseFloat(document.getElementById('scoreTotal')?.value) || 100;
    if (total <= 0) { document.getElementById('gradeResult').innerHTML = '⚠️ Enter valid total'; return; }
    let pct = (score/total)*100;
    let grade = pct >= 90 ? 'A' : pct >= 80 ? 'B' : pct >= 70 ? 'C' : pct >= 60 ? 'D' : 'F';
    document.getElementById('gradeResult').innerHTML = `📊 ${pct.toFixed(1)}% → Grade: ${grade}`;

    let to = document.getElementById('tzTo')?.value || 'PST';
    let tzTime = document.getElementById('tzTime')?.value || '12:00';
    let [h, m] = tzTime.split(':').map(Number);
    let offsets = { UTC: 0, EST: -5, PST: -8, GMT: 0, IST: 5.5, CST: -6 };
    let diff = (offsets[to] || 0) - (offsets[from] || 0);
    let nh = (h + diff + 24) % 24;
    document.getElementById('tzResult').innerHTML = `🕐 ${tzTime} ${from} → ${String(Math.floor(nh)).padStart(2,'0')}:${String(m).padStart(2,'0')} ${to}`;
    processedResults = [{ name: 'timezone.txt', data: `${tzTime} ${from} → ${String(Math.floor(nh)).padStart(2,'0')}:${String(m).padStart(2,'0')} ${to}` }];

    let version = document.getElementById('uuidVersion')?.value || 'v4';
    let uuids = [];
    for (let i=0; i<count; i++) {
      if (version === 'v4') {
        uuids.push('xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
          let r = Math.random()*16|0, v = c === 'x' ? r : (r&0x3|0x8);
          return v.toString(16);
        }));
      } else {
        let d = new Date().getTime();
        uuids.push('xxxxxxxx-xxxx-1xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
          let r = (d + Math.random()*16)%16|0;
          d = Math.floor(d/16);
          return (c === 'x' ? r : (r&0x3|0x8)).toString(16);
        }));
      }
    }
    document.getElementById('uuidResult').innerHTML = uuids.join('<br>');
    processedResults = uuids.map((u, i) => ({ name: `uuid_${i+1}.txt`, data: u }));
  }

  function generateHash() {
    let input = document.getElementById('hashInput')?.value || '';
    let algo = document.getElementById('hashAlgo')?.value || 'md5';
    let hash = '';
    // Simple hash simulation (real hashing would need a library)
    for (let i=0; i<input.length; i++) {
      hash += input.charCodeAt(i).toString(16).padStart(2,'0');
    }
    if (algo === 'md5') hash = hash.substring(0, 32).padEnd(32, '0');
    else if (algo === 'sha1') hash = hash.substring(0, 40).padEnd(40, '0');
    else hash = hash.substring(0, 64).padEnd(64, '0');
    document.getElementById('hashResult').innerHTML = `🔐 ${algo.toUpperCase()}: ${hash}`;
    processedResults = [{ name: 'hash.txt', data: `${algo.toUpperCase()}: ${hash}` }];
  }

  function base64Encode() {
    let input = document.getElementById('b64Input')?.value || '';
    document.getElementById('b64Result').innerHTML = `📤 ${btoa(input)}`;
    processedResults = [{ name: 'base64_encoded.txt', data: btoa(input) }];
  }

  function base64Decode() {
    let input = document.getElementById('b64Input')?.value || '';
    try { document.getElementById('b64Result').innerHTML = `📥 ${atob(input)}`; }
    catch { document.getElementById('b64Result').innerHTML = '⚠️ Invalid Base64'; }
  }

  function urlEncode() {
    let input = document.getElementById('urlInput')?.value || '';
    document.getElementById('urlResult').innerHTML = `🔗 ${encodeURIComponent(input)}`;
    processedResults = [{ name: 'url_encoded.txt', data: encodeURIComponent(input) }];
  }

  function urlDecode() {
    let input = document.getElementById('urlInput')?.value || '';
    try { document.getElementById('urlResult').innerHTML = `🔓 ${decodeURIComponent(input)}`; }
    catch { document.getElementById('urlResult').innerHTML = '⚠️ Invalid URL encoding'; }
  }

  function formatJSON() {
    let input = document.getElementById('jsonInput')?.value || '';
    try {
      let parsed = JSON.parse(input);
      document.getElementById('jsonResult').innerHTML = `<pre>${JSON.stringify(parsed, null, 2)}</pre>`;
      processedResults = [{ name: 'json_formatted.json', data: JSON.stringify(parsed, null, 2) }];
    } catch { document.getElementById('jsonResult').innerHTML = '⚠️ Invalid JSON'; }
  }

  function minifyJSON() {
    let input = document.getElementById('jsonInput')?.value || '';
    try {
      let parsed = JSON.parse(input);
      document.getElementById('jsonResult').innerHTML = JSON.stringify(parsed);
      processedResults = [{ name: 'json_minified.json', data: JSON.stringify(parsed) }];
    } catch { document.getElementById('jsonResult').innerHTML = '⚠️ Invalid JSON'; }
  }

  function generateLorem() {
    let type = document.getElementById('loremType')?.value || 'paragraphs';
    let count = parseInt(document.getElementById('loremCount')?.value) || 3;
    let words = ['lorem','ipsum','dolor','sit','amet','consectetur','adipiscing','elit','sed','do','eiusmod','tempor','incididunt','ut','labore','et','dolore','magna','aliqua','ut','enim','ad','minim','veniam','quis','nostrud','exercitation','ullamco','laboris','nisi','ut','aliquip','ex','ea','commodo','consequat'];
    let text = '';
    if (type === 'paragraphs') {
      for (let i=0; i<count; i++) {
        let p = [];
        for (let j=0; j<30+Math.floor(Math.random()*20); j++) p.push(words[Math.floor(Math.random()*words.length)]);
        text += p.join(' ') + '. ';
      }
    } else if (type === 'sentences') {
      for (let i=0; i<count; i++) {
        let s = [];
        for (let j=0; j<8+Math.floor(Math.random()*6); j++) s.push(words[Math.floor(Math.random()*words.length)]);
        text += s.join(' ') + '. ';
      }
    } else {
      for (let i=0; i<count; i++) text += words[Math.floor(Math.random()*words.length)] + ' ';
    }
    document.getElementById('loremResult').innerHTML = text;
    processedResults = [{ name: 'lorem.txt', data: text }];
  }

  // ==================== UTILITIES ====================
  function showToast(m, isError = false) {
    let t = document.createElement('div');
    t.className = 'toast-msg';
    if (isError) t.style.borderLeftColor = '#dc3545';
    t.innerText = m;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  function toggleDarkMode() {
    darkMode = !darkMode;
    document.body.classList.toggle('dark-mode');
    const b = document.getElementById('darkBtn');
    b.innerHTML = darkMode ? '<i class="bi bi-sun"></i> Light' : '<i class="bi bi-moon"></i> Dark';
    showToast(darkMode ? '🌙 Dark mode' : '☀️ Light mode');
  }

  function downloadResults() {
    if (processedResults.length === 0) { showToast('No results to download', true); return; }
    processedResults.forEach((res, index) => {
      const blob = new Blob([res.data], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = res.name;
      setTimeout(() => { a.click(); URL.revokeObjectURL(url); }, index * 200);
    });
    showToast(`Downloading ${processedResults.length} file(s)`);
  }

  function resetAll() {
    processedResults = [];
    statusInfo.innerHTML = '<span>Ready</span>';
    const activeBtn = document.querySelector('.tool-btn.active');
    if (activeBtn) {
      const toolId = activeBtn.getAttribute('onclick').match(/'([^']+)'/)[1];
      setActiveTool(activeBtn, toolId);
    }
    showToast('🔄 Reset complete');
  }

  // ==================== INIT ====================
  document.addEventListener('DOMContentLoaded', function() {
    renderTools();
    const firstBtn = document.querySelector('.tool-btn');
    if (firstBtn) {
      const toolId = firstBtn.getAttribute('onclick').match(/'([^']+)'/)[1];
      setActiveTool(firstBtn, toolId);
    }
    updateTimerDisplay();
  });
</script>
</body>
</html>
